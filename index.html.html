<style>
/* ============================= TOKENS ============================= */
:root{
  --navy:#0F2A4A;
  --navy-deep:#0A1F38;
  --teal:#0E7C86;
  --teal-light:#E4F1F1;
  --gold:#E8A33D;
  --gold-deep:#C6821F;
  --gold-light:#FCF0DC;
  --bone:#F6F7F9;
  --white:#FFFFFF;
  --ink:#0F2A4A;
  --ink-soft:#54677E;
  --ink-faint:#8494A6;
  --line:rgba(15,42,74,0.10);
  --line-soft:rgba(15,42,74,0.06);
  --danger:#B3432F;
  --danger-light:#FBE8E3;
  --navy-light:rgba(15,42,74,.08);
  --radius-s:8px;
  --radius-m:12px;
  --radius-l:18px;
  --shadow-card:0 1px 2px rgba(10,31,56,0.06), 0 1px 0 rgba(10,31,56,0.04);
  --shadow-pop:0 12px 32px rgba(10,31,56,0.18);
  --sidebar-w:256px;
  --topbar-h:64px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bone:#0A1420; --white:#101E30; --ink:#EEF3F8; --ink-soft:#AEC0D3; --ink-faint:#728398;
    --line:rgba(255,255,255,0.10); --line-soft:rgba(255,255,255,0.06);
    --gold-light:#2A2013; --teal-light:#0E2426; --danger-light:#3A1913;
    --navy:#A9C8ED; --navy-light:rgba(255,255,255,.08);
  }
  :root:not([data-theme="light"]) h1,:root:not([data-theme="light"]) h2,:root:not([data-theme="light"]) h3,:root:not([data-theme="light"]) h4,:root:not([data-theme="light"]) .font-display{ color:var(--ink); }
  :root:not([data-theme="light"]) ::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.18);}
}
:root[data-theme="dark"]{
  --bone:#0A1420; --white:#101E30; --ink:#EEF3F8; --ink-soft:#AEC0D3; --ink-faint:#728398;
  --line:rgba(255,255,255,0.10); --line-soft:rgba(255,255,255,0.06);
  --gold-light:#2A2013; --teal-light:#0E2426; --danger-light:#3A1913;
  --navy:#A9C8ED; --navy-light:rgba(255,255,255,.08);
}
*{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0; background:var(--bone); color:var(--ink);
  font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;
  font-size:14px; line-height:1.5; -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4,.font-display{ font-family:'Fraunces',Georgia,serif; color:var(--navy); letter-spacing:-0.01em; }
:root[data-theme="dark"] h1,:root[data-theme="dark"] h2,:root[data-theme="dark"] h3,:root[data-theme="dark"] h4,:root[data-theme="dark"] .font-display{ color:var(--ink); }
a{color:inherit;}
button{font-family:inherit;}
::selection{ background:var(--gold-light); }
button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, [tabindex]:focus-visible{
  outline:2px solid var(--teal); outline-offset:2px; border-radius:4px;
}
@media (prefers-reduced-motion: reduce){ *{animation-duration:0.001ms !important; transition-duration:0.001ms !important;} }
::-webkit-scrollbar{width:10px;height:10px;}
::-webkit-scrollbar-thumb{background:rgba(15,42,74,0.18);border-radius:8px;}
:root[data-theme="dark"] ::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.18);}
::-webkit-scrollbar-track{background:transparent;}

/* ============================= LAYOUT ============================= */
.app-shell{ display:flex; min-height:100vh; }

.sidebar{
  width:var(--sidebar-w); flex-shrink:0; background:var(--navy-deep);
  color:#CBD8E8; display:flex; flex-direction:column; position:fixed; top:0; left:0; bottom:0;
  z-index:60; transition:transform .25s ease;
}
.sidebar-brand{ padding:22px 20px 16px; display:flex; align-items:center; gap:10px; border-bottom:1px solid rgba(255,255,255,0.08); }
.sidebar-brand img{ height:26px; width:auto; display:block; }
.sidebar-nav{ flex:1; overflow-y:auto; padding:14px 10px; }
.nav-item{
  display:flex; align-items:center; gap:12px; padding:10px 12px; border-radius:10px;
  color:#B7C6D9; text-decoration:none; cursor:pointer; font-size:13.5px; font-weight:500;
  margin-bottom:2px; border-left:3px solid transparent; transition:background .15s ease, color .15s ease;
  user-select:none;
}
.nav-item svg{ width:18px; height:18px; flex-shrink:0; opacity:.85; }
.nav-item:hover{ background:rgba(255,255,255,0.06); color:#fff; }
.nav-item.active{ background:rgba(232,163,61,0.14); color:#fff; border-left-color:var(--gold); }
.nav-item.active svg{ opacity:1; color:var(--gold); }
.nav-section-label{ font-size:10.5px; text-transform:uppercase; letter-spacing:.08em; color:#5E7086; padding:16px 12px 6px; font-weight:700; }
.sidebar-foot{ padding:14px 16px; border-top:1px solid rgba(255,255,255,0.08); font-size:11.5px; color:#5E7086; }

.main-col{ flex:1; margin-left:var(--sidebar-w); min-width:0; display:flex; flex-direction:column; min-height:100vh; }

.topbar{
  height:var(--topbar-h); background:var(--white); border-bottom:1px solid var(--line);
  display:flex; align-items:center; gap:14px; padding:0 22px; position:sticky; top:0; z-index:40;
}
.menu-toggle{ display:none; background:none; border:none; cursor:pointer; color:var(--navy); padding:6px; }
.global-search{ flex:1; max-width:420px; position:relative; }
.global-search input{
  width:100%; padding:9px 14px 9px 36px; border-radius:10px; border:1px solid var(--line);
  background:var(--bone); font-size:13.5px; color:var(--ink);
}
.global-search input:focus{ background:var(--white); border-color:var(--teal); }
.global-search svg{ position:absolute; left:11px; top:50%; transform:translateY(-50%); width:16px; height:16px; color:var(--ink-faint); }
.search-results{ position:absolute; top:44px; left:0; right:0; background:var(--white); border:1px solid var(--line); border-radius:var(--radius-m); box-shadow:var(--shadow-pop); max-height:340px; overflow-y:auto; z-index:80; display:none; }
.search-results.open{ display:block; }
.search-result-item{ padding:10px 14px; cursor:pointer; border-bottom:1px solid var(--line-soft); display:flex; justify-content:space-between; gap:10px; align-items:center; }
.search-result-item:hover{ background:var(--bone); }
.search-result-item:last-child{ border-bottom:none; }

.topbar-spacer{ flex:1; }
.icon-btn{ position:relative; background:none; border:none; cursor:pointer; color:var(--ink-soft); padding:8px; border-radius:9px; display:flex; }
.icon-btn:hover{ background:var(--bone); color:var(--navy); }
.icon-btn svg{ width:19px; height:19px; }
.badge-dot{ position:absolute; top:5px; right:5px; min-width:15px; height:15px; padding:0 3px; border-radius:8px; background:var(--danger); color:#fff; font-size:9.5px; font-weight:700; display:flex; align-items:center; justify-content:center; }
.profile-chip{ display:flex; align-items:center; gap:9px; cursor:pointer; padding:6px 8px 6px 6px; border-radius:11px; }
.profile-chip:hover{ background:var(--bone); }
.avatar{ width:32px; height:32px; border-radius:50%; background:linear-gradient(135deg,var(--gold),var(--gold-deep)); color:#fff; display:flex; align-items:center; justify-content:center; font-weight:700; font-size:12.5px; flex-shrink:0; }
.profile-meta{ line-height:1.2; }
.profile-meta strong{ display:block; font-size:12.5px; color:var(--navy); }
.profile-meta span{ font-size:11px; color:var(--ink-faint); }

.dropdown-panel{ position:absolute; top:56px; right:22px; width:340px; background:var(--white); border:1px solid var(--line); border-radius:var(--radius-m); box-shadow:var(--shadow-pop); z-index:80; display:none; overflow:hidden; }
.dropdown-panel.open{ display:block; }
.dropdown-head{ padding:14px 16px; border-bottom:1px solid var(--line-soft); font-weight:700; color:var(--navy); font-size:13.5px; display:flex; justify-content:space-between; align-items:center;}
.dropdown-body{ max-height:380px; overflow-y:auto; }
.alert-item{ padding:11px 16px; border-bottom:1px solid var(--line-soft); font-size:12.5px; cursor:pointer; display:flex; gap:10px; }
.alert-item:hover{ background:var(--bone); }
.alert-dot{ width:8px; height:8px; border-radius:50%; margin-top:5px; flex-shrink:0; background:var(--ink-faint); }
.alert-item .t{ color:var(--ink); font-weight:600; }
.alert-item .d{ color:var(--ink-faint); font-size:11.5px; margin-top:1px; }

.view{ display:none; padding:24px 28px 60px; flex:1; }
.view.active{ display:block; }
.view-head{ display:flex; align-items:flex-end; justify-content:space-between; gap:16px; margin-bottom:20px; flex-wrap:wrap; }
.view-head h1{ font-size:26px; margin:0 0 4px; font-weight:700; }
.view-head p{ margin:0; color:var(--ink-soft); font-size:13px; }
.view-actions{ display:flex; gap:10px; flex-wrap:wrap; }

/* ============================= BUTTONS ============================= */
.btn{ appearance:none; border:none; cursor:pointer; font-weight:600; font-size:13px; border-radius:10px; padding:9px 16px; display:inline-flex; align-items:center; gap:7px; white-space:nowrap; transition:transform .08s ease, box-shadow .15s ease, background .15s ease; }
.btn svg{ width:15px; height:15px; }
.btn:active{ transform:scale(0.97); }
.btn-primary{ background:var(--gold-deep); color:#fff; box-shadow:0 1px 2px rgba(198,130,31,.35); }
.btn-primary:hover{ background:#B5751B; }
.btn-secondary{ background:var(--white); color:var(--navy); border:1px solid var(--line); }
.btn-secondary:hover{ background:var(--bone); }
.btn-ghost{ background:transparent; color:var(--ink-soft); }
.btn-ghost:hover{ background:var(--line-soft); color:var(--navy); }
.btn-danger{ background:var(--danger); color:#fff; }
.btn-danger:hover{ background:#96351F; }
.btn-teal{ background:var(--teal); color:#fff; }
.btn-teal:hover{ background:#0B6771; }
.btn-sm{ padding:6px 11px; font-size:12px; border-radius:8px; }
.btn-icon{ padding:8px; border-radius:9px; }
.btn:disabled{ opacity:.5; cursor:not-allowed; }

/* ============================= CARDS / KPI ============================= */
.grid{ display:grid; gap:16px; }
.grid-kpi{ grid-template-columns:repeat(5,1fr); }
.grid-2{ grid-template-columns:2fr 1fr; }
.grid-3{ grid-template-columns:repeat(3,1fr); }
.grid-4{ grid-template-columns:repeat(4,1fr); }
@media (max-width:1400px){ .grid-kpi{ grid-template-columns:repeat(3,1fr); } }
@media (max-width:900px){ .grid-kpi{ grid-template-columns:repeat(2,1fr); } .grid-2,.grid-3,.grid-4{ grid-template-columns:1fr; } }

.card{ background:var(--white); border:1px solid var(--line); border-radius:var(--radius-m); box-shadow:var(--shadow-card); }
.card-pad{ padding:18px 20px; }
.card-head{ display:flex; align-items:center; justify-content:space-between; padding:16px 20px; border-bottom:1px solid var(--line-soft); }
.card-head h3{ margin:0; font-size:15px; font-weight:700; }
.card-head .hint{ font-size:11.5px; color:var(--ink-faint); font-weight:500; }

.kpi{ padding:16px 18px; display:flex; flex-direction:column; gap:8px; }
.kpi-top{ display:flex; align-items:center; justify-content:space-between; }
.kpi-icon{ width:34px; height:34px; border-radius:9px; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
.kpi-icon svg{ width:17px; height:17px; }
.kpi-icon.c-navy{ background:var(--navy-light); color:var(--navy); }
.kpi-icon.c-teal{ background:var(--teal-light); color:var(--teal); }
.kpi-icon.c-gold{ background:var(--gold-light); color:var(--gold-deep); }
.kpi-icon.c-danger{ background:var(--danger-light); color:var(--danger); }
.kpi-trend{ font-size:11px; font-weight:700; padding:2px 7px; border-radius:20px; }
.kpi-trend.up{ background:var(--teal-light); color:var(--teal); }
.kpi-trend.down{ background:var(--danger-light); color:var(--danger); }
.kpi-value{ font-family:'Fraunces',serif; font-size:28px; font-weight:700; color:var(--navy); line-height:1; }
.kpi-label{ font-size:12px; color:var(--ink-soft); font-weight:500; }

/* ============================= TABLE ============================= */
.table-wrap{ overflow-x:auto; }
table.dtable{ width:100%; border-collapse:collapse; font-size:13px; min-width:760px; }
table.dtable thead th{ text-align:left; font-weight:600; color:var(--ink-soft); font-size:12px; padding:11px 14px; border-bottom:1px solid var(--line); background:var(--bone); white-space:nowrap; position:sticky; top:0; cursor:pointer; user-select:none; }
table.dtable thead th:hover{ color:var(--navy); }
table.dtable thead th .sort-caret{ opacity:.4; font-size:10px; margin-left:3px; }
table.dtable tbody td{ padding:11px 14px; border-bottom:1px solid var(--line-soft); vertical-align:middle; color:var(--ink); }
table.dtable tbody tr{ transition:background .1s ease; }
table.dtable tbody tr:hover{ background:var(--bone); }
table.dtable tbody tr:last-child td{ border-bottom:none; }
.cell-name{ font-weight:600; color:var(--navy); cursor:pointer; }
.cell-name:hover{ text-decoration:underline; }
.cell-sub{ color:var(--ink-faint); font-size:11.5px; }
.row-actions{ display:flex; gap:4px; opacity:.85; }
.empty-state{ text-align:center; padding:56px 20px; color:var(--ink-faint); }
.empty-state svg{ width:40px; height:40px; margin-bottom:10px; opacity:.5; }
.empty-state h4{ margin:0 0 4px; color:var(--ink-soft); }

/* ============================= BADGES ============================= */
.badge{ display:inline-flex; align-items:center; gap:5px; padding:3px 10px; border-radius:20px; font-size:11.5px; font-weight:600; white-space:nowrap; }
.badge .dot{ width:6px; height:6px; border-radius:50%; }
.b-navy{ background:var(--navy-light); color:var(--navy); }
.b-teal{ background:var(--teal-light); color:var(--teal); }
.b-gold{ background:var(--gold-light); color:var(--gold-deep); }
.b-danger{ background:var(--danger-light); color:var(--danger); }
.b-gray{ background:var(--line-soft); color:var(--ink-soft); }
.tag{ display:inline-flex; align-items:center; gap:4px; padding:2px 9px; border-radius:6px; font-size:11px; font-weight:600; background:var(--gold-light); color:var(--gold-deep); }
.star-btn{ background:none; border:none; cursor:pointer; color:var(--line); padding:2px; display:inline-flex; }
.star-btn.on{ color:var(--gold); }
.star-btn svg{ width:16px; height:16px; }

/* ============================= FORMS ============================= */
.field{ margin-bottom:14px; }
.field label{ display:block; font-size:12px; font-weight:600; color:var(--ink-soft); margin-bottom:5px; }
.field .req{ color:var(--danger); }
.field input[type=text], .field input[type=tel], .field input[type=email], .field input[type=number], .field input[type=date], .field input[type=time], .field select, .field textarea{
  width:100%; padding:9px 12px; border:1px solid var(--line); border-radius:9px; font-size:13px; font-family:inherit; background:var(--white); color:var(--ink);
}
.field input:focus, .field select:focus, .field textarea:focus{ border-color:var(--teal); }
.field textarea{ resize:vertical; min-height:64px; }
.field-hint{ font-size:11px; color:var(--ink-faint); margin-top:4px; }
.field-row{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }
.field-row-3{ display:grid; grid-template-columns:1fr 1fr 1fr; gap:12px; }
@media (max-width:560px){ .field-row,.field-row-3{ grid-template-columns:1fr; } }
.checkbox-row{ display:flex; align-items:center; gap:8px; }
.checkbox-row input{ width:15px; height:15px; }
.form-section-title{ font-size:11.5px; font-weight:700; text-transform:uppercase; letter-spacing:.06em; color:var(--teal); margin:20px 0 10px; padding-top:14px; border-top:1px solid var(--line-soft); }
.form-section-title:first-child{ margin-top:0; padding-top:0; border-top:none; }
.chip-select{ display:flex; flex-wrap:wrap; gap:7px; }
.chip-opt{ padding:6px 12px; border-radius:20px; border:1px solid var(--line); font-size:12px; cursor:pointer; background:var(--white); color:var(--ink-soft); font-weight:500; }
.chip-opt.sel{ background:var(--navy-deep); border-color:var(--navy-deep); color:#fff; }

/* ============================= MODAL ============================= */
.modal-overlay{ position:fixed; inset:0; background:rgba(10,20,32,.55); display:none; align-items:flex-start; justify-content:center; z-index:200; padding:40px 16px; overflow-y:auto; }
.modal-overlay.open{ display:flex; }
.modal{ background:var(--white); border-radius:var(--radius-l); width:100%; max-width:560px; box-shadow:var(--shadow-pop); animation:pop .18s ease; margin-bottom:40px; }
.modal.modal-lg{ max-width:880px; }
.modal.modal-xl{ max-width:1080px; }
@keyframes pop{ from{ opacity:0; transform:translateY(8px) scale(.98); } to{ opacity:1; transform:none; } }
.modal-head{ display:flex; align-items:center; justify-content:space-between; padding:18px 22px; border-bottom:1px solid var(--line); }
.modal-head h2{ margin:0; font-size:19px; }
.modal-close{ background:var(--bone); border:none; width:30px; height:30px; border-radius:50%; cursor:pointer; display:flex; align-items:center; justify-content:center; color:var(--ink-soft); }
.modal-close:hover{ background:var(--line-soft); color:var(--navy); }
.modal-body{ padding:20px 22px; max-height:70vh; overflow-y:auto; }
.modal-foot{ display:flex; justify-content:flex-end; gap:10px; padding:16px 22px; border-top:1px solid var(--line); }
.confirm-icon{ width:46px; height:46px; border-radius:50%; background:var(--danger-light); color:var(--danger); display:flex; align-items:center; justify-content:center; margin-bottom:14px; }
.confirm-icon svg{ width:22px; height:22px; }

/* ============================= TOAST ============================= */
.toast-stack{ position:fixed; bottom:20px; right:20px; z-index:400; display:flex; flex-direction:column; gap:10px; align-items:flex-end; }
.toast{ background:var(--navy-deep); color:#fff; padding:12px 16px; border-radius:10px; font-size:13px; font-weight:500; box-shadow:var(--shadow-pop); display:flex; align-items:center; gap:10px; animation:toastin .2s ease; max-width:340px; }
.toast.err{ background:var(--danger); }
.toast.ok{ background:var(--teal); }
@keyframes toastin{ from{ opacity:0; transform:translateY(8px); } to{ opacity:1; transform:none; } }

/* ============================= TABS ============================= */
.tabs{ display:flex; gap:2px; border-bottom:1px solid var(--line); margin-bottom:18px; overflow-x:auto; }
.tab-btn{ padding:10px 15px; background:none; border:none; cursor:pointer; font-size:13px; font-weight:600; color:var(--ink-faint); border-bottom:2px solid transparent; white-space:nowrap; }
.tab-btn:hover{ color:var(--navy); }
.tab-btn.active{ color:var(--navy); border-bottom-color:var(--gold-deep); }
.tab-pane{ display:none; }
.tab-pane.active{ display:block; }

/* ============================= PROGRESS LINE ============================= */
.progress-line{ display:flex; align-items:flex-start; margin:6px 0 22px; overflow-x:auto; padding-bottom:4px; }
.pl-step{ display:flex; flex-direction:column; align-items:center; gap:6px; min-width:80px; position:relative; cursor:pointer; }
.pl-dot{ width:26px; height:26px; border-radius:50%; background:var(--line-soft); color:var(--ink-faint); display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:700; border:2px solid var(--white); box-shadow:0 0 0 1px var(--line); flex-shrink:0; }
.pl-step.done .pl-dot{ background:var(--teal); color:#fff; box-shadow:none; }
.pl-step.current .pl-dot{ background:var(--gold-deep); color:#fff; box-shadow:0 0 0 4px var(--gold-light); }
.pl-label{ font-size:10.5px; color:var(--ink-faint); text-align:center; font-weight:600; max-width:86px; }
.pl-step.done .pl-label, .pl-step.current .pl-label{ color:var(--navy); }
.pl-line{ flex:1; height:2px; background:var(--line); min-width:16px; margin-top:12px; }
.pl-line.done{ background:var(--teal); }

/* ============================= KANBAN ============================= */
.kanban{ display:flex; gap:14px; overflow-x:auto; padding-bottom:12px; align-items:flex-start; }
.kanban-col{ background:var(--bone); border-radius:var(--radius-m); min-width:250px; max-width:270px; flex-shrink:0; border:1px solid var(--line-soft); }
.kanban-col-head{ padding:12px 14px; display:flex; align-items:center; justify-content:space-between; font-weight:700; font-size:12.5px; color:var(--navy); border-bottom:1px solid var(--line); }
.kanban-col-head .count{ background:var(--white); border-radius:20px; padding:1px 8px; font-size:11px; color:var(--ink-soft); }
.kanban-cards{ padding:10px; display:flex; flex-direction:column; gap:8px; min-height:60px; }
.kanban-cards.dragover{ background:var(--gold-light); border-radius:8px; }
.kanban-card{ background:var(--white); border:1px solid var(--line); border-radius:10px; padding:10px 12px; cursor:grab; box-shadow:var(--shadow-card); }
.kanban-card:active{ cursor:grabbing; }
.kanban-card .kc-name{ font-weight:700; font-size:12.5px; color:var(--navy); margin-bottom:3px; }
.kanban-card .kc-meta{ font-size:11px; color:var(--ink-faint); display:flex; justify-content:space-between; align-items:center; margin-top:6px; }

/* ============================= CALENDAR ============================= */
.cal-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; }
.cal-grid{ display:grid; grid-template-columns:repeat(7,1fr); gap:6px; }
.cal-dow{ text-align:center; font-size:11px; font-weight:700; color:var(--ink-faint); padding-bottom:6px; }
.cal-cell{ background:var(--white); border:1px solid var(--line-soft); border-radius:10px; min-height:92px; padding:6px; cursor:pointer; }
.cal-cell:hover{ border-color:var(--teal); }
.cal-cell.other-month{ opacity:.4; }
.cal-cell.today{ border-color:var(--gold-deep); box-shadow:0 0 0 1px var(--gold-deep); }
.cal-daynum{ font-size:11.5px; font-weight:700; color:var(--navy); }
.cal-evt{ font-size:9.5px; padding:2px 5px; border-radius:5px; margin-top:3px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; font-weight:600; }
@media (max-width:900px){ .cal-cell{ min-height:60px; } .cal-evt{ display:none; } .cal-cell .cal-evt:first-of-type{ display:block; } }

/* ============================= MISC ============================= */
.filter-bar{ display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-bottom:16px; }
.filter-bar select, .filter-bar input[type=text]{ padding:8px 12px; border-radius:9px; border:1px solid var(--line); font-size:12.5px; background:var(--white); color:var(--ink); }
.filter-bar .search-mini{ position:relative; }
.filter-bar .search-mini svg{ position:absolute; left:9px; top:50%; transform:translateY(-50%); width:14px; height:14px; color:var(--ink-faint); }
.filter-bar .search-mini input{ padding-left:30px; min-width:200px; }
.seg-toggle{ display:flex; background:var(--bone); border-radius:9px; padding:3px; gap:2px; }
.seg-toggle button{ border:none; background:none; padding:6px 13px; border-radius:7px; font-size:12px; font-weight:600; color:var(--ink-soft); cursor:pointer; }
.seg-toggle button.active{ background:var(--white); color:var(--navy); box-shadow:var(--shadow-card); }
.mobile-overlay{ display:none; position:fixed; inset:0; background:rgba(10,20,32,.5); z-index:50; }
.mobile-overlay.open{ display:block; }
.timeline{ position:relative; padding-left:22px; }
.timeline:before{ content:''; position:absolute; left:5px; top:4px; bottom:4px; width:2px; background:var(--line); }
.tl-item{ position:relative; padding-bottom:18px; }
.tl-item:before{ content:''; position:absolute; left:-22px; top:2px; width:11px; height:11px; border-radius:50%; background:var(--teal); border:2px solid var(--white); box-shadow:0 0 0 1px var(--teal); }
.tl-item .tl-date{ font-size:11px; color:var(--ink-faint); font-weight:600; }
.tl-item .tl-text{ font-size:13px; color:var(--ink); margin-top:2px; }
.copy-ico{ background:none;border:none;cursor:pointer;color:var(--ink-faint);padding:2px;display:inline-flex;vertical-align:middle;}
.copy-ico:hover{ color:var(--teal); }
.copy-ico svg{ width:13px;height:13px; }
.detail-grid{ display:grid; grid-template-columns:1fr 1fr; gap:2px 24px; }
@media (max-width:640px){ .detail-grid{ grid-template-columns:1fr; } }
.detail-row{ padding:8px 0; border-bottom:1px solid var(--line-soft); display:flex; justify-content:space-between; gap:10px; font-size:12.5px; }
.detail-row .k{ color:var(--ink-faint); }
.detail-row .v{ color:var(--ink); font-weight:600; text-align:right; }
.loading-spin{ width:16px;height:16px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite; }
@keyframes spin{ to{ transform:rotate(360deg); } }
.skeleton{ background:linear-gradient(90deg,var(--line-soft) 25%,var(--line) 37%,var(--line-soft) 63%); background-size:400% 100%; animation:sk 1.4s ease infinite; border-radius:8px; }
@keyframes sk{ 0%{background-position:100% 50%;} 100%{background-position:0 50%;} }
.demo-flag{ font-size:9.5px; font-weight:800; letter-spacing:.03em; padding:1px 6px; border-radius:5px; background:var(--gold-light); color:var(--gold-deep); margin-left:6px; }
.overdue-row{ background:var(--danger-light) !important; }
.dot-danger{ background:var(--danger); } .dot-gold{ background:var(--gold); } .dot-teal{ background:var(--teal); } .dot-navy{ background:var(--navy-deep); } .dot-gray{ background:var(--ink-faint); }

/* ============================= MOBILE ============================= */
@media (max-width:900px){
  .sidebar{ transform:translateX(-100%); }
  .sidebar.open{ transform:translateX(0); }
  .main-col{ margin-left:0; }
  .menu-toggle{ display:flex; }
  .view{ padding:18px 14px 50px; }
  .global-search{ max-width:none; }
}
</style>
</head>

<script>
/* ---------------------------- DATE / FORMAT HELPERS ---------------------------- */
function todayDate(){ const d=new Date(); d.setHours(0,0,0,0); return d; }
function isoDate(d){ return d.toISOString().slice(0,10); }
function addDays(iso, n){ const d=new Date(iso+'T00:00:00'); d.setDate(d.getDate()+n); return isoDate(d); }
function daysAgoISO(n){ return addDays(isoDate(todayDate()), -n); }
function daysFromNowISO(n){ return addDays(isoDate(todayDate()), n); }
function daysBetween(isoA, isoB){ const a=new Date(isoA+'T00:00:00'), b=new Date(isoB+'T00:00:00'); return Math.round((b-a)/86400000); }
function fmtDate(iso){ if(!iso) return '—'; const d=new Date(iso+'T00:00:00'); if(isNaN(d)) return '—'; return d.toLocaleDateString('es-ES',{day:'2-digit',month:'short',year:'numeric'}); }
function fmtDateShort(iso){ if(!iso) return '—'; const d=new Date(iso+'T00:00:00'); if(isNaN(d)) return '—'; return d.toLocaleDateString('es-ES',{day:'2-digit',month:'short'}); }
function fmtDateTime(iso){ if(!iso) return '—'; const d=new Date(iso); if(isNaN(d)) return '—'; return d.toLocaleDateString('es-ES',{day:'2-digit',month:'short'})+' · '+d.toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit'}); }
function fmtMoney(n){ n=Number(n)||0; return '$'+n.toLocaleString('en-US',{minimumFractionDigits:0,maximumFractionDigits:2}); }
function escapeHtml(s){ if(s==null) return ''; return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function escAttr(s){ return escapeHtml(s).replace(/`/g,'&#96;'); }
function debounce(fn, wait){ let t; return function(...a){ clearTimeout(t); t=setTimeout(()=>fn.apply(this,a), wait); }; }

/* ---------------------------- ID GENERATION ---------------------------- */
const ID_PREFIX = {client:'CP',lead:'LD',task:'TSK',followup:'SEG',payment:'PAY',sale:'V',document:'DOC',process:'PR',note:'NOTE',campaign:'CAMP',event:'EVT',activity:'ACT'};
function uid(kind){
  DB.state.counters[kind] = (DB.state.counters[kind]||0)+1;
  return ID_PREFIX[kind]+'-'+String(DB.state.counters[kind]).padStart(4,'0');
}

/* ---------------------------- COMPUTED FIELDS ---------------------------- */
function diasSinContacto(client){
  const last = client.ultimoContacto || client.fechaIngreso;
  return Math.max(0, daysBetween(last, isoDate(todayDate())));
}
function computeRisk(client){
  if(client.estado==='Cancelado' || client.estado==='Finalizado') return null;
  const d = diasSinContacto(client);
  if(d<=3) return 'Bajo';
  if(d<=6) return 'Medio';
  if(d<=9) return 'Alto';
  return 'Crítico';
}
function computeDocsPct(clientId){
  const docs = DB.state.documents.filter(d=>d.clienteId===clientId);
  if(!docs.length) return 0;
  const done = docs.filter(d=>d.estado==='Recibido'||d.estado==='Revisado').length;
  return Math.round(done/docs.length*100);
}
function computeProgresoPct(etapa){
  const idx = CONFIG.etapas.indexOf(etapa);
  if(idx<0) return 0;
  return Math.round(idx/(CONFIG.etapas.length-1)*100);
}
function clientPagos(clienteId){ return DB.state.payments.filter(p=>p.clienteId===clienteId).sort((a,b)=> (b.fecha||'').localeCompare(a.fecha||'')); }
function clientTotalPagado(clienteId){
  return clientPagos(clienteId).reduce((s,p)=>{
    if(p.estado==='Aprobado') return s+Number(p.valorTotal||0);
    if(p.estado==='Parcial') return s+Number(p.valorPagado||0);
    return s;
  },0);
}
function clientSaldo(client){ return Math.max(0, Number(client.valorServicio||0) - clientTotalPagado(client.id)); }
function clientDocs(clienteId){ return DB.state.documents.filter(d=>d.clienteId===clienteId); }
function clientFollowups(clienteId){ return DB.state.followups.filter(f=>f.clienteId===clienteId).sort((a,b)=> (b.fecha||'').localeCompare(a.fecha||'')); }
function clientProcesses(clienteId){ return DB.state.processes.filter(p=>p.clienteId===clienteId); }
function clientNotes(clienteId){ return DB.state.notes.filter(n=>n.clienteId===clienteId).sort((a,b)=> (b.fecha||'').localeCompare(a.fecha||'')); }
function getClient(id){ return DB.state.clients.find(c=>c.id===id); }
function getLead(id){ return DB.state.leads.find(l=>l.id===id); }

/* ---------------------------- TOASTS / MODALS ---------------------------- */
function toast(msg, type){
  const stack = document.getElementById('toastStack');
  const el = document.createElement('div');
  el.className = 'toast'+(type==='err'?' err':type==='ok'?' ok':'');
  el.innerHTML = (type==='ok'?ic('check2'):type==='err'?ic('alert'):ic('info'))+'<span>'+escapeHtml(msg)+'</span>';
  stack.appendChild(el);
  setTimeout(()=>{ el.style.transition='opacity .25s ease'; el.style.opacity='0'; setTimeout(()=>el.remove(),260); }, 3400);
}
function openModal(innerHtml, size){
  const root = document.getElementById('modalRoot');
  root.innerHTML = `<div class="modal ${size==='lg'?'modal-lg':size==='xl'?'modal-xl':''}">${innerHtml}</div>`;
  root.classList.add('open');
}
function closeModal(){
  const root = document.getElementById('modalRoot');
  root.classList.remove('open');
  setTimeout(()=>{ if(!root.classList.contains('open')) root.innerHTML=''; }, 200);
}
function confirmDialog({title, text, okLabel, danger, onConfirm}){
  const html = `
    <div class="modal-body" style="padding-top:26px;">
      <div class="confirm-icon">${ic('alert')}</div>
      <h2 style="margin:0 0 8px;font-size:18px;">${escapeHtml(title)}</h2>
      <p style="color:var(--ink-soft);font-size:13.5px;margin:0;line-height:1.5;">${text}</p>
    </div>
    <div class="modal-foot">
      <button class="btn btn-secondary" onclick="closeModal()">Cancelar</button>
      <button class="btn ${danger===false?'btn-primary':'btn-danger'}" id="confirmOkBtn">${escapeHtml(okLabel||'Confirmar')}</button>
    </div>`;
  openModal(html);
  document.getElementById('confirmOkBtn').addEventListener('click', ()=>{ closeModal(); onConfirm(); });
}

/* ---------------------------- CLIPBOARD / WHATSAPP ---------------------------- */
async function copyToClipboard(text, label){
  if(!text){ toast('Nada para copiar','err'); return; }
  try{ await navigator.clipboard.writeText(text); toast((label||'Dato')+' copiado al portapapeles','ok'); return; }
  catch(e){}
  try{
    const ta=document.createElement('textarea'); ta.value=text; ta.style.position='fixed'; ta.style.opacity='0';
    document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove();
    toast((label||'Dato')+' copiado al portapapeles','ok');
  }catch(e2){ toast('No se pudo copiar','err'); }
}
function waLink(phone){ const digits=String(phone||'').replace(/[^\d]/g,''); return 'https://wa.me/'+digits; }

/* ---------------------------- RUNTIME CAPABILITIES ---------------------------- */
async function getCap(name){
  try{ if(window.claude && typeof window.claude.use==='function'){ return await window.claude.use(name); } }catch(e){}
  return null;
}

/* ---------------------------- CSV ---------------------------- */
function toCsvValue(v){ v = v==null? '' : String(v); if(/[",\n]/.test(v)){ v='"'+v.replace(/"/g,'""')+'"'; } return v; }
function arrayToCsv(headers, rows){
  const lines=[headers.map(toCsvValue).join(',')];
  rows.forEach(r=>lines.push(r.map(toCsvValue).join(',')));
  return '\uFEFF'+lines.join('\r\n');
}
async function exportCsv(filename, headers, rows){
  const csv = arrayToCsv(headers, rows);
  const downloads = await getCap('downloads');
  if(downloads){
    try{
      const res = await downloads.save({filename, data:csv});
      if(res){ toast(filename+' descargado','ok'); } else { toast('Descarga cancelada','err'); }
      return;
    }catch(e){ /* fall through to browser fallback */ }
  }
  try{
    const blob=new Blob([csv],{type:'text/csv;charset=utf-8;'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a'); a.href=url; a.download=filename; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),1000);
    toast(filename+' listo','ok');
  }catch(e){ toast('No se pudo exportar el archivo','err'); }
}
function parseCsv(text){
  const rows=[]; let row=[]; let cur=''; let inQ=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(inQ){
      if(c==='"'){ if(text[i+1]==='"'){ cur+='"'; i++; } else inQ=false; }
      else cur+=c;
    }else{
      if(c==='"') inQ=true;
      else if(c===','){ row.push(cur); cur=''; }
      else if(c==='\n'){ row.push(cur); rows.push(row); row=[]; cur=''; }
      else if(c==='\r'){}
      else cur+=c;
    }
  }
  if(cur.length || row.length){ row.push(cur); rows.push(row); }
  return rows.filter(r=> !(r.length===1 && r[0].trim()===''));
}

<script>
/* =====================================================================
   DB — persistence layer. Swap this object's internals for real API
   calls later; nothing else in the app touches localStorage directly.
   ===================================================================== */
const DB = {
  KEY:'creditplus_crm_v1',
  state:null,
  remoteEnabled:false,
  remoteRef:null,
  _saveTimer:null,
  _applyingRemote:false,
  initRemote(){
    try{
      const cfg = window.FIREBASE_CONFIG;
      if(!cfg || cfg.apiKey==='TU_API_KEY_AQUI' || !window.firebase){ return; }
      if(!firebase.apps || !firebase.apps.length) firebase.initializeApp(cfg);
      const fs = firebase.firestore();
      this.remoteRef = fs.collection('creditplus').doc('estado');
      this.remoteEnabled = true;
    }catch(e){ console.warn('No se pudo conectar la base de datos compartida', e); this.remoteEnabled=false; }
  },
  load(){
    try{
      const raw = localStorage.getItem(this.KEY);
      if(raw){ this.state = JSON.parse(raw); this.migrate(); }
      else { this.state = seedDemoData(); }
    }catch(e){ console.warn('No se pudo leer el almacenamiento local', e); this.state = seedDemoData(); }
    this.initRemote();
    if(this.remoteEnabled){ this.attachRemoteSync(); }
    else { this.save(); }
  },
  attachRemoteSync(){
    this.remoteRef.onSnapshot((snap)=>{
      if(snap.exists){
        const data = snap.data();
        if(data && typeof data.payload==='string'){
          try{
            this._applyingRemote = true;
            this.state = JSON.parse(data.payload);
            this.migrate();
            try{ localStorage.setItem(this.KEY, JSON.stringify(this.state)); }catch(e2){}
            if(typeof renderChrome==='function') renderChrome();
            if(typeof renderCurrent==='function') renderCurrent();
          } finally { this._applyingRemote = false; }
        }
      } else {
        // Primera vez que alguien conecta: sube el estado actual como punto de partida compartido.
        this.remoteRef.set({payload: JSON.stringify(this.state), updatedAt: Date.now()}).catch(e=>console.warn('No se pudo crear el documento compartido', e));
      }
    }, (err)=>{
      console.warn('Firestore onSnapshot error', err);
      if(typeof toast==='function') toast('Se perdió la conexión con la base de datos compartida — sigues trabajando localmente','err');
    });
  },
  migrate(){
    const s=this.state;
    s.counters = s.counters || {};
    Object.keys(ID_PREFIX).forEach(k=>{ if(typeof s.counters[k]!=='number') s.counters[k]=0; });
    s.config = s.config || {};
    s.config.responsables = s.config.responsables || ['Cristian','Isabel','Sofia','Juan David'];
    s.config.fuentesExtra = s.config.fuentesExtra || [];
    s.config.serviciosExtra = s.config.serviciosExtra || [];
    s.config.role = s.config.role || 'Administrador';
    s.config.currentUser = s.config.currentUser || 'Cristian';
    s.ui = s.ui || {};
    if(s.ui.theme!=='dark' && s.ui.theme!=='light') s.ui.theme = null;
    ['clients','leads','tasks','followups','payments','sales','documents','processes','notes','campaigns','events','activity'].forEach(k=>{ if(!Array.isArray(s[k])) s[k]=[]; });
  },
  save(){
    try{ localStorage.setItem(this.KEY, JSON.stringify(this.state)); }
    catch(e){ console.warn('No se pudo guardar', e); toast('No se pudo guardar (almacenamiento lleno o bloqueado por el navegador)','err'); }
    if(this.remoteEnabled && !this._applyingRemote){
      clearTimeout(this._saveTimer);
      this._saveTimer = setTimeout(()=>{
        this.remoteRef.set({payload: JSON.stringify(this.state), updatedAt: Date.now()})
          .catch(e=>{ console.warn('No se pudo sincronizar con el equipo', e); toast('No se pudo sincronizar con el equipo — revisa tu conexión','err'); });
      }, 600);
    }
  },
  resetToDemo(){ this.state = seedDemoData(); this.save(); },
  wipeAll(){ this.state = emptyState(); this.save(); }
};

<script>
/* ---------------------------- ALERTS / AUTOMATIONS ---------------------------- */
function computeAlerts(){
  const today = isoDate(todayDate());
  const alerts = [];
  DB.state.clients.forEach(c=>{
    if(c.estado==='Cancelado'||c.estado==='Finalizado') return;
    if(c.proximoSeguimiento){
      if(c.proximoSeguimiento < today) alerts.push({sev:'danger',tipo:'Seguimiento vencido',texto:`El seguimiento de ${c.nombre} está vencido desde el ${fmtDateShort(c.proximoSeguimiento)}`,clienteId:c.id,fecha:c.proximoSeguimiento});
      else if(c.proximoSeguimiento===today) alerts.push({sev:'gold',tipo:'Seguimiento para hoy',texto:`Seguimiento programado hoy con ${c.nombre}`,clienteId:c.id,fecha:c.proximoSeguimiento});
    } else {
      alerts.push({sev:'gray',tipo:'Sin próximo seguimiento',texto:`${c.nombre} no tiene un próximo seguimiento definido`,clienteId:c.id,fecha:today});
    }
    const dsc = diasSinContacto(c);
    if(dsc>=10) alerts.push({sev:'danger',tipo:'Riesgo crítico',texto:`${c.nombre} lleva ${dsc} días sin contacto`,clienteId:c.id,fecha:today});
    const docs = clientDocs(c.id);
    if(docs.some(d=>d.estado==='Pendiente'||d.estado==='Falta información')) alerts.push({sev:'gold',tipo:'Documentos pendientes',texto:`${c.nombre} tiene documentos pendientes por recibir`,clienteId:c.id,fecha:today});
  });
  DB.state.leads.forEach(l=>{
    if(['Venta','No interesado','Perdido'].includes(l.estado)) return;
    const base = l.ultimoContacto || l.fechaLead;
    const d = daysBetween(base, today);
    if(d>=2) alerts.push({sev:'danger',tipo:'Lead sin contactar',texto:`${l.nombre} lleva ${d} días sin contacto`,leadId:l.id,fecha:today});
  });
  DB.state.payments.forEach(p=>{
    if(p.estado==='Aprobado'||p.estado==='Reembolsado') return;
    const c = getClient(p.clienteId); if(!c) return;
    if(p.estado==='Vencido' || (p.proximaFecha && p.proximaFecha<today)) alerts.push({sev:'danger',tipo:'Pago vencido',texto:`Pago de ${fmtMoney(p.valorTotal)} de ${c.nombre} está vencido`,clienteId:c.id,fecha:p.proximaFecha||today});
    else if(p.proximaFecha && p.proximaFecha>=today && daysBetween(today,p.proximaFecha)<=3) alerts.push({sev:'gold',tipo:'Pago próximo',texto:`Pago de ${fmtMoney(p.valorTotal)} de ${c.nombre} vence el ${fmtDateShort(p.proximaFecha)}`,clienteId:c.id,fecha:p.proximaFecha});
  });
  DB.state.tasks.forEach(t=>{
    if(t.estado==='Completada') return;
    if(t.fechaLimite && t.fechaLimite<today) alerts.push({sev:'danger',tipo:'Tarea vencida',texto:t.titulo,clienteId:t.clienteId,taskId:t.id,fecha:t.fechaLimite});
  });
  alerts.sort((a,b)=>(a.fecha||'').localeCompare(b.fecha||''));
  return alerts;
}

/* ---------------------------- NAV / ROUTER ---------------------------- */
const NAV = [
  {key:'dashboard',label:'Dashboard',icon:'dashboard'},
  {key:'clientes',label:'Clientes',icon:'users'},
  {key:'leads',label:'Leads',icon:'target'},

  Administrador: NAV.map(n=>n.key),

function switchView(key){
  if(!key) return;
  APP.currentView = key;
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
  const el = document.getElementById('view-'+key);
  if(el) el.classList.add('active');
  renderSidebar();
  renderView(key);
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('mobileOverlay').classList.remove('open');
  window.scrollTo(0,0);
}
function renderView(key){
  try{
    switch(key){
      case 'dashboard': renderDashboard(); break;
      case 'clientes': renderClientes(); break;
      case 'leads': renderLeads(); break;
      case 'seguimiento': renderSeguimiento(); break;
      case 'ventas': renderVentas(); break;
      case 'pagos': renderPagos(); break;
      case 'tareas': renderTareas(); break;
      case 'calendario': renderCalendario(); break;
      case 'reportes': renderReportes(); break;
      case 'campanas': renderCampanas(); break;
      case 'configuracion': renderConfiguracion(); break;
    }
  }catch(e){ console.error('Error rendering view', key, e); }
}
function renderCurrent(){ renderView(APP.currentView); }
function commit(){ DB.save(); renderChrome(); renderCurrent(); }
function renderChrome(){ renderSidebar(); renderNotifications(); renderProfile(); renderSyncStatus(); }
function renderSyncStatus(){
  const el = document.getElementById('sidebarFoot');
  if(!el) return;
  if(DB.remoteEnabled){
    el.innerHTML = 'CreditPlus CRM · v1.0<br><span style="color:#6FCF97;">● Conectado — datos compartidos con el equipo</span>';
  } else {
    el.innerHTML = 'CreditPlus CRM · v1.0<br>Datos guardados solo en este navegador';
  }
}

function canEdit(){ return DB.state.config.role!=='Auditor'; }
function isAsesor(){ return DB.state.config.role==='Asesor'; }
function scoped(list, ownerField){ if(isAsesor()) return list.filter(x=>x[ownerField]===DB.state.config.currentUser); return list; }

function renderSidebar(){
  const role = DB.state.config.role;
  const visible = NAV_ROLE_VISIBLE[role]||NAV.map(n=>n.key);
  document.getElementById('sidebarNav').innerHTML = NAV.filter(n=>visible.includes(n.key)).map(n=>`
    <div class="nav-item ${APP.currentView===n.key?'active':''}" data-nav="${n.key}">${ICONS[n.icon]}<span>${n.label}</span></div>
  `).join('');
}
function renderNotifications(){
  const alerts = computeAlerts();
  const badge = document.getElementById('notifCount');
  if(alerts.length){ badge.style.display='flex'; badge.textContent = alerts.length>99?'99+':alerts.length; } else { badge.style.display='none'; }
  document.getElementById('notifHint').textContent = alerts.length+' activas';
  const body = document.getElementById('notifBody');
  if(!alerts.length){ body.innerHTML = `<div class="empty-state" style="padding:28px 16px;">${ic('check2')}<h4>Todo al día</h4><p style="font-size:12px;margin:0;">No hay alertas pendientes.</p></div>`; return; }
  body.innerHTML = alerts.slice(0,40).map(a=>`
    <div class="alert-item" data-alert-client="${a.clienteId||''}" data-alert-task="${a.taskId||''}">
      <span class="alert-dot dot-${a.sev}"></span>
      <div><div class="t">${escapeHtml(a.tipo)}</div><div class="d">${escapeHtml(a.texto)}</div></div>
    </div>`).join('');
}
function renderProfile(){
  const cfg = DB.state.config;
  document.getElementById('profileName').textContent = cfg.currentUser;
  document.getElementById('profileRole').textContent = cfg.role;
  document.getElementById('profileAvatar').textContent = cfg.currentUser.split(' ').map(w=>w[0]).slice(0,2).join('').toUpperCase();
  document.getElementById('roleSwitchList').innerHTML = CONFIG.roles.map(r=>`
    <div class="nav-item" data-set-role="${r}" style="color:${r===cfg.role?'var(--gold-deep)':'var(--ink)'};${r===cfg.role?'background:var(--gold-light);':''}">
      <span style="width:16px;display:inline-flex;">${r===cfg.role?ic('check2'):''}</span><span>${r}</span>
    </div>`).join('');
}

/* ---------------------------- GLOBAL SEARCH ---------------------------- */
function globalSearch(q){
  q=(q||'').trim().toLowerCase(); if(!q) return [];
  const res=[];
  DB.state.clients.forEach(c=>{
    if(c.nombre.toLowerCase().includes(q)||(c.telefono||'').replace(/\D/g,'').includes(q.replace(/\D/g,''))||(c.email||'').toLowerCase().includes(q))
      res.push({type:'Cliente',id:c.id,label:c.nombre,sub:(c.telefono||c.email||c.id)});
  });
  DB.state.leads.forEach(l=>{
    if(l.nombre.toLowerCase().includes(q)||(l.telefono||'').replace(/\D/g,'').includes(q.replace(/\D/g,''))||(l.email||'').toLowerCase().includes(q))
      res.push({type:'Lead',id:l.id,label:l.nombre,sub:(l.telefono||l.email||l.id)});
  });
  return res.slice(0,12);
}
function renderSearchResults(list){
  const box = document.getElementById('globalSearchResults');
  if(!list.length){ box.classList.remove('open'); box.innerHTML=''; return; }
  box.innerHTML = list.map(r=>`
    <div class="search-result-item" data-search-open="${r.type}:${r.id}">
      <div><div style="font-weight:600;color:var(--navy);font-size:13px;">${escapeHtml(r.label)}</div><div style="font-size:11px;color:var(--ink-faint);">${escapeHtml(r.sub)}</div></div>
      <span class="badge b-${r.type==='Cliente'?'teal':'gold'}">${r.type}</span>
    </div>`).join('');
  box.classList.add('open');
}

    </div>
    <div class="grid grid-3" style="margin-bottom:16px;">
      <div class="card"><div class="card-head"><h3>Clientes nuevos por mes</h3></div><div class="card-pad"><canvas id="chartClientesNuevos" height="190"></canvas></div></div>
      <div class="card"><div class="card-head"><h3>Etapa del proceso</h3></div><div class="card-pad"><canvas id="chartEtapas" height="190"></canvas></div></div>
      <div class="card"><div class="card-head"><h3>Nivel de riesgo</h3></div><div class="card-pad"><canvas id="chartRiesgo" height="190"></canvas></div></div>
    </div>
    <div class="grid grid-2">
      <div class="card"><div class="card-head"><h3>Actividad reciente</h3></div><div class="card-pad"><div class="timeline" id="dashActivity"></div></div></div>
      <div class="card"><div class="card-head"><h3>Pendientes de hoy</h3><span class="hint" id="pendHoyCount"></span></div><div class="card-pad" id="dashPendHoy"></div></div>
    </div>`;

  const actEl = document.getElementById('dashActivity');
  const acts = DB.state.activity.slice(0,8);
  actEl.innerHTML = acts.length ? acts.map(a=>`<div class="tl-item"><div class="tl-date">${fmtDateTime(a.fecha)}</div><div class="tl-text">${escapeHtml(a.texto)}</div></div>`).join('') : `<p style="color:var(--ink-faint);font-size:13px;">Sin actividad todavía.</p>`;

  const pendTareas = DB.state.tasks.filter(t=>t.estado!=='Completada' && t.fechaLimite && t.fechaLimite<=today);
  const pendSeg = clients.filter(c=>c.proximoSeguimiento && c.proximoSeguimiento<=today && !['Cancelado','Finalizado'].includes(c.estado));
  document.getElementById('pendHoyCount').textContent = (pendTareas.length+pendSeg.length)+' pendientes';
  let pendHtml='';
  pendSeg.forEach(c=> pendHtml += `<div class="alert-item" style="padding:9px 0;" data-open-client="${c.id}"><span class="alert-dot ${c.proximoSeguimiento<today?'dot-danger':'dot-gold'}"></span><div><div class="t">Seguimiento — ${escapeHtml(c.nombre)}</div><div class="d">${c.proximoSeguimiento<today?'Vencido':'Hoy'} · ${fmtDateShort(c.proximoSeguimiento)}</div></div></div>`);
  pendTareas.forEach(t=> pendHtml += `<div class="alert-item" style="padding:9px 0;" data-open-task="${t.id}"><span class="alert-dot ${t.fechaLimite<today?'dot-danger':'dot-gold'}"></span><div><div class="t">Tarea — ${escapeHtml(t.titulo)}</div><div class="d">${escapeHtml(t.responsable)} · ${t.fechaLimite<today?'Vencida':'Hoy'}</div></div></div>`);
  document.getElementById('dashPendHoy').innerHTML = pendHtml || `<p style="color:var(--ink-faint);font-size:13px;">Nada pendiente por hoy.</p>`;

  renderDashboardCharts(clients);
}

function renderDashboardCharts(clients){
  if(typeof Chart==='undefined') return;
  Chart.defaults.font.family = "'Inter', sans-serif";
  Chart.defaults.color = '#8494A6';

  const months = lastNMonths(6);
  const labels = months.map(monthShortLabel);
  const salesCount = months.map(d=>{ const mk=d.toISOString().slice(0,7); return DB.state.sales.filter(s=>(s.fecha||'').slice(0,7)===mk).length; });
  const ingresos = months.map(d=>{ const mk=d.toISOString().slice(0,7); return DB.state.payments.filter(p=>p.estado==='Aprobado'&&(p.fecha||'').slice(0,7)===mk).reduce((s,p)=>s+Number(p.valorTotal||0),0); });
  makeChart('chartVentasIngresos', { type:'bar', data:{ labels, datasets:[
      {label:'Ventas', data:salesCount, backgroundColor:'#0F2A4A', borderRadius:5, order:2},
      {label:'Ingresos ($)', data:ingresos, type:'line', borderColor:'#E8A33D', backgroundColor:'#E8A33D', tension:.35, yAxisID:'y1', pointRadius:3, order:1}
    ]}, options:{ responsive:true, maintainAspectRatio:false, interaction:{mode:'index',intersect:false}, scales:{ y:{beginAtZero:true, grid:{display:false}}, y1:{beginAtZero:true, position:'right', grid:{display:false}} }, plugins:{legend:{position:'bottom'}} } });

  const leadEstados = CONFIG.estadosLead;
  makeChart('chartLeadsEstado', { type:'bar', data:{labels:leadEstados, datasets:[{data:leadEstados.map(es=>DB.state.leads.filter(l=>l.estado===es).length), backgroundColor:'#0E7C86', borderRadius:5}]}, options:{maintainAspectRatio:false, indexAxis:'y', plugins:{legend:{display:false}}, scales:{x:{beginAtZero:true,grid:{display:false},ticks:{precision:0}}, y:{grid:{display:false}, ticks:{font:{size:10.5}}}}} });

  const palette = ['#0F2A4A','#0E7C86','#E8A33D','#C6821F','#8494A6','#B3432F','#54677E','#0A1F38','#F0C888'];
  makeChart('chartFuentes', { type:'doughnut', data:{labels:CONFIG.fuentes, datasets:[{data:CONFIG.fuentes.map(f=>clients.filter(c=>c.fuente===f).length), backgroundColor:palette, borderWidth:0}]}, options:{maintainAspectRatio:false, plugins:{legend:{position:'bottom', labels:{padding:8, font:{size:10.5}}}}, cutout:'62%'} });

  makeChart('chartClientesNuevos', { type:'bar', data:{labels, datasets:[{data:months.map(d=>{ const mk=d.toISOString().slice(0,7); return DB.state.clients.filter(c=>(c.fechaIngreso||'').slice(0,7)===mk).length; }), backgroundColor:'#C6821F', borderRadius:5}]}, options:{maintainAspectRatio:false, plugins:{legend:{display:false}}, scales:{y:{beginAtZero:true,grid:{display:false},ticks:{precision:0}},x:{grid:{display:false}}}} });

  makeChart('chartEtapas', { type:'bar', data:{labels:CONFIG.etapas, datasets:[{data:CONFIG.etapas.map(e=>clients.filter(c=>c.etapa===e).length), backgroundColor:'#0F2A4A', borderRadius:5}]}, options:{maintainAspectRatio:false, plugins:{legend:{display:false}}, scales:{y:{beginAtZero:true,grid:{display:false},ticks:{precision:0}},x:{grid:{display:false}, ticks:{autoSkip:false, maxRotation:38, minRotation:38, font:{size:9.5}}}}} });

  const riesgoColors = {Bajo:'#0E7C86',Medio:'#E8A33D',Alto:'#C6821F','Crítico':'#B3432F'};
  makeChart('chartRiesgo', { type:'doughnut', data:{labels:CONFIG.nivelesRiesgo, datasets:[{data:CONFIG.nivelesRiesgo.map(r=>clients.filter(c=>computeRisk(c)===r).length), backgroundColor:CONFIG.nivelesRiesgo.map(r=>riesgoColors[r]), borderWidth:0}]}, options:{maintainAspectRatio:false, plugins:{legend:{position:'bottom'}}, cutout:'62%'} });
}
</script>
<script>
/* =====================================================================
   CLIENTES — list, filters, sorting
   ===================================================================== */
function filteredClients(){
  let list = scoped(DB.state.clients,'asesor').slice();
  const f = APP.clientFilters;
  if(f.q){ const q=f.q.toLowerCase(); list=list.filter(c=>c.nombre.toLowerCase().includes(q)||(c.telefono||'').toLowerCase().includes(q)||(c.email||'').toLowerCase().includes(q)); }
  if(f.estado) list=list.filter(c=>c.estado===f.estado);
  if(f.etapa) list=list.filter(c=>c.etapa===f.etapa);
  if(f.responsable) list=list.filter(c=>c.asesor===f.responsable);
  if(f.fuente) list=list.filter(c=>c.fuente===f.fuente);
  if(f.riesgo) list=list.filter(c=>computeRisk(c)===f.riesgo);
  if(f.pago==='pendiente') list=list.filter(c=>clientSaldo(c)>0);
  if(f.pago==='pagado') list=list.filter(c=>clientSaldo(c)<=0);
  if(f.fav) list=list.filter(c=>c.favorito);
  const {col,dir}=APP.clientSort;
  list.sort((a,b)=>{
    let av,bv;
    if(col==='etapa'){ av=CONFIG.etapas.indexOf(a.etapa); bv=CONFIG.etapas.indexOf(b.etapa); }
    else if(col==='proximo'){ av=a.proximoSeguimiento||'9999-99'; bv=b.proximoSeguimiento||'9999-99'; }
    else if(col==='saldo'){ av=clientSaldo(a); bv=clientSaldo(b); }
    else if(col==='responsable'){ av=a.asesor; bv=b.asesor; }
    else { av=a[col]!==undefined?a[col]:a.nombre; bv=b[col]!==undefined?b[col]:b.nombre; }
    if(typeof av==='string') return av.localeCompare(bv)*dir;
    return ((av||0)-(bv||0))*dir;
  });
  return list;
}
function sortCaret(col){ return APP.clientSort.col===col ? (APP.clientSort.dir===1?' ▲':' ▼') : ''; }

function renderClientes(){
  const el = document.getElementById('view-clientes');
  if(APP.clientDetailId){ renderClientDetail(el); return; }
  const list = filteredClients();
  const f = APP.clientFilters;
  const anyFilter = f.q||f.estado||f.etapa||f.responsable||f.fuente||f.riesgo||f.pago||f.fav;
  el.innerHTML = `
    <div class="view-head">
      <div><h1>Clientes</h1><p>${DB.state.clients.length} clientes registrados${isAsesor()?' · mostrando solo los tuyos':''}</p></div>
      <div class="view-actions">
        ${canEdit()?`<button class="btn btn-secondary" data-action="import-clients">${ic('upload')}Importar</button>`:''}
        <button class="btn btn-secondary" data-action="export-clients">${ic('download')}Exportar</button>
        ${canEdit()?`<button class="btn btn-primary" data-action="open-client-form">${ic('plus')}Agregar cliente</button>`:''}
      </div>
    </div>
    <div class="filter-bar">
      <div class="search-mini">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input type="text" id="cliSearch" placeholder="Buscar nombre, teléfono o email" value="${escAttr(f.q||'')}">
      </div>
      <select id="fEstado"><option value="">Estado (todos)</option>${CONFIG.estadosCliente.map(x=>`<option ${f.estado===x?'selected':''}>${x}</option>`).join('')}</select>
      <select id="fEtapa"><option value="">Etapa (todas)</option>${CONFIG.etapas.map(x=>`<option ${f.etapa===x?'selected':''}>${x}</option>`).join('')}</select>
      <select id="fResp"><option value="">Responsable (todos)</option>${DB.state.config.responsables.map(x=>`<option ${f.responsable===x?'selected':''}>${x}</option>`).join('')}</select>
      <select id="fFuente"><option value="">Fuente (todas)</option>${CONFIG.fuentes.map(x=>`<option ${f.fuente===x?'selected':''}>${x}</option>`).join('')}</select>
      <select id="fRiesgo"><option value="">Riesgo (todos)</option>${CONFIG.nivelesRiesgo.map(x=>`<option ${f.riesgo===x?'selected':''}>${x}</option>`).join('')}</select>
      <select id="fPago"><option value="">Pago (todos)</option><option value="pendiente" ${f.pago==='pendiente'?'selected':''}>Con saldo pendiente</option><option value="pagado" ${f.pago==='pagado'?'selected':''}>Al día</option></select>
      <button class="btn btn-sm ${f.fav?'btn-primary':'btn-secondary'}" id="fFav">${ic('star')}Favoritos</button>
      ${anyFilter?`<button class="btn btn-ghost btn-sm" id="fClear">${ic('x')}Limpiar</button>`:''}
    </div>
    <div class="card">
      <div class="table-wrap"><table class="dtable"><thead><tr>
        <th style="width:34px;"></th>
        <th data-sort="nombre">Cliente${sortCaret('nombre')}</th>
        <th data-sort="estado">Estado${sortCaret('estado')}</th>
        <th data-sort="etapa">Etapa${sortCaret('etapa')}</th>
        <th>Riesgo</th>
        <th>Servicio</th>
        <th data-sort="responsable">Responsable${sortCaret('responsable')}</th>
        <th data-sort="proximo">Próx. seguimiento${sortCaret('proximo')}</th>
        <th data-sort="saldo">Saldo${sortCaret('saldo')}</th>
        <th>Acciones</th>
      </tr></thead><tbody>
      ${list.length?list.map(clientRowHtml).join(''):`<tr><td colspan="10"><div class="empty-state">${ic('users')}<h4>No hay clientes con estos filtros</h4><p style="font-size:12.5px;">Ajusta los filtros o agrega un nuevo cliente.</p></div></td></tr>`}
      </tbody></table></div>
    </div>`;
  wireClientListEvents();
}
function clientRowHtml(c){
  const riesgo = computeRisk(c);
  const saldo = clientSaldo(c);
  const today = isoDate(todayDate());
  const overdue = c.proximoSeguimiento && c.proximoSeguimiento<today && !['Cancelado','Finalizado'].includes(c.estado);
  return `<tr class="${overdue?'overdue-row':''}">
    <td><button class="star-btn ${c.favorito?'on':''}" data-toggle-fav="${c.id}">${ic(c.favorito?'star':'starOutline')}</button></td>
    <td><span class="cell-name" data-open-client="${c.id}">${escapeHtml(c.nombre)}</span>${c.demo?'<span class="demo-flag">DEMO</span>':''}<div class="cell-sub">${escapeHtml(c.telefono||c.email||'')}</div></td>
    <td><span class="badge b-${COLOR_ESTADO[c.estado]||'gray'}">${c.estado}</span></td>
    <td><span class="badge b-navy">${c.etapa}</span></td>
    <td>${riesgo?`<span class="badge b-${COLOR_RIESGO[riesgo]}"><span class="dot dot-${COLOR_RIESGO[riesgo]}"></span>${riesgo}</span>`:'<span class="cell-sub">—</span>'}</td>
    <td style="font-size:12.5px;">${escapeHtml(c.servicio)}</td>
    <td style="font-size:12.5px;">${escapeHtml(c.asesor)}</td>
    <td style="font-size:12.5px;${overdue?'color:var(--danger);font-weight:700;':''}">${c.proximoSeguimiento?fmtDateShort(c.proximoSeguimiento):'—'}</td>
    <td style="font-size:12.5px;font-weight:700;color:${saldo>0?'var(--danger)':'var(--teal)'};">${fmtMoney(saldo)}</td>
    <td><div class="row-actions">
      <button class="btn btn-icon btn-ghost" data-open-client="${c.id}" title="Ver">${ic('eye')}</button>
      ${canEdit()?`<button class="btn btn-icon btn-ghost" data-action="open-client-form" data-id="${c.id}" title="Editar">${ic('edit')}</button>`:''}
      <button class="btn btn-icon btn-ghost" data-action="whatsapp" data-phone="${escAttr(c.whatsapp||c.telefono)}" title="WhatsApp">${ic('chat')}</button>
      ${canEdit()?`<button class="btn btn-icon btn-ghost" data-action="delete-client" data-id="${c.id}" title="Eliminar">${ic('trash')}</button>`:''}
    </div></td>
  </tr>`;
}
function wireClientListEvents(){
  const q=document.getElementById('cliSearch'); if(q) q.addEventListener('input', debounce(e=>{ APP.clientFilters.q=e.target.value; renderClientes(); },250));
  const map={fEstado:'estado',fEtapa:'etapa',fResp:'responsable',fFuente:'fuente',fRiesgo:'riesgo',fPago:'pago'};
  Object.keys(map).forEach(id=>{ const elx=document.getElementById(id); if(elx) elx.addEventListener('change',e=>{ APP.clientFilters[map[id]]=e.target.value; renderClientes(); }); });
  const favBtn=document.getElementById('fFav'); if(favBtn) favBtn.addEventListener('click',()=>{ APP.clientFilters.fav=!APP.clientFilters.fav; renderClientes(); });
  const clearBtn=document.getElementById('fClear'); if(clearBtn) clearBtn.addEventListener('click',()=>{ APP.clientFilters={}; renderClientes(); });
  document.querySelectorAll('#view-clientes th[data-sort]').forEach(th=>th.addEventListener('click',()=>{
    const col=th.getAttribute('data-sort');
    if(APP.clientSort.col===col) APP.clientSort.dir*=-1; else { APP.clientSort.col=col; APP.clientSort.dir=1; }
    renderClientes();
  }));
}
</script>
<script>
/* =====================================================================
   FICHA DE CLIENTE (detail view)
   ===================================================================== */
function openClientDetail(id){ if(!getClient(id)) return; APP.clientDetailId=id; APP.clientDetailTab='info'; switchView('clientes'); }
function closeClientDetail(){ APP.clientDetailId=null; renderClientes(); }

function progressLineHtml(client){
  const idx = CONFIG.etapas.indexOf(client.etapa);
  let html = '<div class="progress-line">';
  CONFIG.etapas.forEach((e,i)=>{
    const state = i<idx?'done':i===idx?'current':'';
    html += `<div class="pl-step ${state}" data-set-etapa="${escAttr(e)}" data-client="${client.id}" title="Marcar etapa: ${escAttr(e)}"><div class="pl-dot">${i<idx?'✓':i+1}</div><div class="pl-label">${e}</div></div>`;
    if(i<CONFIG.etapas.length-1) html += `<div class="pl-line ${i<idx?'done':''}"></div>`;
  });
  html += '</div>';
  return html;
}

function renderClientDetail(el){
  const c = getClient(APP.clientDetailId);
  if(!c){ closeClientDetail(); return; }
  const riesgo = computeRisk(c);
  const saldo = clientSaldo(c);
  const pagado = clientTotalPagado(c.id);
  const tabs = [
    {k:'info',l:'Información'},
    {k:'documentos',l:'Documentos ('+clientDocs(c.id).length+')'},
    {k:'notas',l:'Notas ('+clientNotes(c.id).length+')'},
    {k:'seguimientos',l:'Seguimientos ('+clientFollowups(c.id).length+')'},
    {k:'pagos',l:'Pagos ('+clientPagos(c.id).length+')'},
    {k:'procesos',l:'Procesos ('+clientProcesses(c.id).length+')'},
    {k:'cronologia',l:'Cronología'},
  ];
  el.innerHTML = `
    <button class="btn btn-ghost btn-sm" id="backToList" style="margin-bottom:14px;">${ic('chevronL')}Volver a clientes</button>
    <div class="card card-pad" style="margin-bottom:18px;">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:14px;">
        <div style="display:flex;gap:14px;align-items:flex-start;">
          <div class="avatar" style="width:52px;height:52px;font-size:17px;">${initials(c.nombre)}</div>
          <div>
            <h2 style="margin:0 0 4px;font-size:20px;display:flex;align-items:center;gap:8px;">${escapeHtml(c.nombre)}
              <button class="star-btn ${c.favorito?'on':''}" data-toggle-fav="${c.id}">${ic(c.favorito?'star':'starOutline')}</button>
              ${c.demo?'<span class="demo-flag">DEMO</span>':''}
            </h2>
            <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;">
              <span class="badge b-${COLOR_ESTADO[c.estado]||'gray'}">${c.estado}</span>
              <span class="badge b-navy">${c.etapa}</span>
              ${riesgo?`<span class="badge b-${COLOR_RIESGO[riesgo]}"><span class="dot dot-${COLOR_RIESGO[riesgo]}"></span>Riesgo ${riesgo}</span>`:''}
              <span class="cell-sub">${c.id} · Asesor: ${escapeHtml(c.asesor)}</span>
            </div>
          </div>
        </div>
        <div class="row-actions" style="gap:8px;">
          <button class="btn btn-secondary btn-sm" data-action="whatsapp" data-phone="${escAttr(c.whatsapp||c.telefono)}">${ic('chat')}WhatsApp</button>
          <button class="btn btn-secondary btn-sm" data-action="copy" data-value="${escAttr(c.telefono)}" data-label="Teléfono">${ic('copy')}Teléfono</button>
          <button class="btn btn-secondary btn-sm" data-action="copy" data-value="${escAttr(c.email)}" data-label="Email">${ic('copy')}Email</button>
          ${canEdit()?`<button class="btn btn-secondary btn-sm" data-action="open-client-form" data-id="${c.id}">${ic('edit')}Editar</button>`:''}
          ${canEdit()?`<button class="btn btn-danger btn-sm" data-action="delete-client" data-id="${c.id}">${ic('trash')}Eliminar</button>`:''}
        </div>
      </div>
      <div style="margin-top:20px;">${progressLineHtml(c)}</div>
      <div class="grid grid-4" style="gap:12px;">
        <div class="card-pad" style="background:var(--bone);border-radius:10px;"><div class="cell-sub">Valor del servicio</div><div style="font-weight:700;font-size:15px;color:var(--navy);">${fmtMoney(c.valorServicio)}</div></div>
        <div class="card-pad" style="background:var(--bone);border-radius:10px;"><div class="cell-sub">Pagado</div><div style="font-weight:700;font-size:15px;color:var(--teal);">${fmtMoney(pagado)}</div></div>
        <div class="card-pad" style="background:var(--bone);border-radius:10px;"><div class="cell-sub">Saldo</div><div style="font-weight:700;font-size:15px;color:${saldo>0?'var(--danger)':'var(--teal)'};">${fmtMoney(saldo)}</div></div>
        <div class="card-pad" style="background:var(--bone);border-radius:10px;"><div class="cell-sub">Documentos completos</div><div style="font-weight:700;font-size:15px;color:var(--navy);">${computeDocsPct(c.id)}%</div></div>
      </div>
    </div>
    <div class="tabs">${tabs.map(t=>`<button class="tab-btn ${APP.clientDetailTab===t.k?'active':''}" data-client-tab="${t.k}">${t.l}</button>`).join('')}</div>
    <div id="clientTabBody"></div>
  `;
  document.getElementById('backToList').addEventListener('click', closeClientDetail);
  document.querySelectorAll('[data-client-tab]').forEach(b=>b.addEventListener('click',()=>{ APP.clientDetailTab=b.getAttribute('data-client-tab'); renderClientDetail(el); }));
  renderClientTabBody(c);
}
function initials(name){ return (name||'?').split(' ').filter(Boolean).slice(0,2).map(w=>w[0]).join('').toUpperCase(); }

function renderClientTabBody(c){
  const body = document.getElementById('clientTabBody');
  if(!body) return;
  switch(APP.clientDetailTab){
    case 'info': body.innerHTML = tabInfoHtml(c); break;
    case 'documentos': body.innerHTML = tabDocumentosHtml(c); break;
    case 'notas': body.innerHTML = tabNotasHtml(c); break;
    case 'seguimientos': body.innerHTML = tabSeguimientosHtml(c); break;
    case 'pagos': body.innerHTML = tabPagosHtml(c); break;
    case 'procesos': body.innerHTML = tabProcesosHtml(c); break;
    case 'cronologia': body.innerHTML = tabCronologiaHtml(c); break;
  }
  wireClientTabEvents(c);
}

function tabInfoHtml(c){
  const cr = c.credito||{};
  return `
  <div class="grid grid-2" style="align-items:start;">
    <div class="card card-pad">
      <div class="form-section-title" style="margin-top:0;">Información principal</div>
      <div class="detail-row"><span class="k">Teléfono</span><span class="v">${escapeHtml(c.telefono)||'—'} ${c.telefono?`<button class="copy-ico" data-action="copy" data-value="${escAttr(c.telefono)}" data-label="Teléfono">${ic('copy')}</button>`:''}</span></div>
      <div class="detail-row"><span class="k">WhatsApp</span><span class="v">${escapeHtml(c.whatsapp)||'—'}</span></div>
      <div class="detail-row"><span class="k">Email</span><span class="v">${escapeHtml(c.email)||'—'} ${c.email?`<button class="copy-ico" data-action="copy" data-value="${escAttr(c.email)}" data-label="Email">${ic('copy')}</button>`:''}</span></div>
      <div class="detail-row"><span class="k">Fecha de nacimiento</span><span class="v">${c.fechaNacimiento?fmtDate(c.fechaNacimiento):'—'}</span></div>
      <div class="detail-row"><span class="k">Documento de identidad</span><span class="v">${escapeHtml(c.documentoId)||'—'}</span></div>
      <div class="detail-row"><span class="k">Dirección</span><span class="v">${escapeHtml(c.direccion)||'—'}</span></div>

<script>

  const docs = clientDocs(c.id);

  <div class="table-wrap"><table class="dtable"><thead><tr><th>Tipo</th><th>Estado</th><th>Solicitado</th><th>Recibido</th><th>Validado por</th><th>Notas</th><th></th></tr></thead><tbody>
