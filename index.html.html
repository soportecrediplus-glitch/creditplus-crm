    <td style="font-size:12px;">${fmtDateShort(d.fechaSolicitud)}</td>
    <td style="font-size:12px;">${d.fechaRecibido?fmtDateShort(d.fechaRecibido):'—'}</td>
    <td style="font-size:12px;">${escapeHtml(d.validadoPor)||'—'}</td>
    <td style="font-size:12px;color:var(--ink-faint);">${escapeHtml(d.notas)||''}</td>
    <td>${canEdit()?`<button class="btn btn-icon btn-ghost" data-action="delete-document" data-id="${d.id}">${ic('trash')}</button>`:''}</td>
  </tr>`).join(''):`<tr><td colspan="7"><div class="empty-state">${ic('filetext')}<h4>Sin documentos registrados</h4></div></td></tr>`}
  </tbody></table></div></div>`;
}
function tabNotasHtml(c){
  const notes = clientNotes(c.id);
  return `<div class="card card-pad">
  ${canEdit()?`<div class="field" style="margin-bottom:16px;"><label>Agregar nota interna</label><textarea id="newNoteText" placeholder="Escribe una nota sobre este cliente..."></textarea>
  <div style="margin-top:8px;text-align:right;"><button class="btn btn-primary btn-sm" data-action="add-note" data-client="${c.id}">${ic('plus')}Agregar nota</button></div></div>`:''}
  <div class="timeline">${notes.length?notes.map(n=>`<div class="tl-item"><div class="tl-date">${fmtDate(n.fecha)} · ${escapeHtml(n.usuario)}</div><div class="tl-text">${escapeHtml(n.contenido)}</div></div>`).join(''):'<p style="color:var(--ink-faint);font-size:13px;">Sin notas registradas.</p>'}</div></div>`;
}
function tabSeguimientosHtml(c){
  const list = clientFollowups(c.id);
  const today = isoDate(todayDate());
  return `<div class="card"><div class="card-head"><h3>Seguimientos</h3>${canEdit()?`<button class="btn btn-primary btn-sm" data-action="open-followup-form" data-client="${c.id}">${ic('plus')}Agregar seguimiento</button>`:''}</div>
  <div class="table-wrap"><table class="dtable"><thead><tr><th>Fecha</th><th>Canal</th><th>Motivo</th><th>Resultado</th><th>Próx. contacto</th><th>Prioridad</th><th></th></tr></thead><tbody>
  ${list.length?list.map(f=>`<tr class="${f.proximoContacto&&f.proximoContacto<today?'overdue-row':''}">
    <td style="font-size:12px;">${fmtDateShort(f.fecha)} ${f.hora||''}</td>
    <td><span class="badge b-navy">${escapeHtml(f.canal)}</span></td>
    <td style="font-size:12.5px;">${escapeHtml(f.motivo)}</td>
    <td style="font-size:12.5px;">${escapeHtml(f.resultado)}</td>
    <td style="font-size:12px;">${f.proximoContacto?fmtDateShort(f.proximoContacto):'—'}</td>
    <td><span class="badge b-${COLOR_PRIORIDAD[f.prioridad]||'gray'}">${f.prioridad}</span></td>
    <td>${canEdit()?`<button class="btn btn-icon btn-ghost" data-action="delete-followup" data-id="${f.id}">${ic('trash')}</button>`:''}</td>
  </tr>`).join(''):`<tr><td colspan="7"><div class="empty-state">${ic('clock')}<h4>Sin seguimientos registrados</h4></div></td></tr>`}
  </tbody></table></div></div>`;
}
function tabPagosHtml(c){
  const list = clientPagos(c.id);
  const today = isoDate(todayDate());
  return `<div class="card"><div class="card-head"><h3>Pagos</h3><div class="row-actions">${canEdit()?`<button class="btn btn-secondary btn-sm" data-action="quick-create-payment" data-client="${c.id}" title="Crea de una vez el próximo pago de este cliente, pendiente de aprobación">${ic('plus')}Generar próximo pago</button>`:''}${canEdit()?`<button class="btn btn-primary btn-sm" data-action="open-payment-form" data-client="${c.id}">${ic('plus')}Registrar pago</button>`:''}</div></div>
  <div class="table-wrap"><table class="dtable"><thead><tr><th>Concepto</th><th>Valor</th><th>Estado</th><th>Fecha</th><th>Próx. fecha</th><th>Método</th><th></th></tr></thead><tbody>
  ${list.length?list.map(p=>`<tr class="${(p.estado==='Vencido'||(p.proximaFecha&&p.proximaFecha<today&&!['Aprobado','Reembolsado'].includes(p.estado)))?'overdue-row':''}">
    <td style="font-weight:600;font-size:12.5px;">${escapeHtml(p.concepto)}</td>
    <td style="font-size:12.5px;">${fmtMoney(p.estado==='Parcial'?p.valorPagado:p.valorTotal)}<span class="cell-sub"> / ${fmtMoney(p.valorTotal)}</span></td>
    <td>${canEdit()?`<select data-pay-status="${p.id}">${CONFIG.estadosPago.map(x=>`<option ${p.estado===x?'selected':''}>${x}</option>`).join('')}</select>`:`<span class="badge b-${COLOR_PAGO[p.estado]||'gray'}">${p.estado}</span>`}</td>
    <td style="font-size:12px;">${p.fecha?fmtDateShort(p.fecha):'—'}</td>
    <td style="font-size:12px;">${p.proximaFecha?fmtDateShort(p.proximaFecha):'—'}</td>
    <td style="font-size:12px;">${escapeHtml(p.metodo)}</td>
    <td>${canEdit()?`<button class="btn btn-icon btn-ghost" data-action="delete-payment" data-id="${p.id}">${ic('trash')}</button>`:''}</td>
  </tr>`).join(''):`<tr><td colspan="7"><div class="empty-state">${ic('card')}<h4>Sin pagos registrados</h4></div></td></tr>`}
  </tbody></table></div></div>`;
}
function tabProcesosHtml(c){
  const list = clientProcesses(c.id);
  return `<div class="card"><div class="card-head"><h3>Procesos</h3>${canEdit()?`<button class="btn btn-primary btn-sm" data-action="open-process-form" data-client="${c.id}">${ic('plus')}Agregar proceso</button>`:''}</div>
  <div class="table-wrap"><table class="dtable"><thead><tr><th>Tipo</th><th>Estado</th><th>Responsable</th><th>Próxima acción</th><th>Fecha</th><th>Resultado</th><th></th></tr></thead><tbody>
  ${list.length?list.map(p=>`<tr>
    <td style="font-weight:600;font-size:12.5px;">${escapeHtml(p.tipo)}</td>
    <td><span class="badge b-${p.estado==='Completado'?'teal':(p.estado==='Pausado'?'gray':'gold')}">${p.estado}</span></td>
    <td style="font-size:12.5px;">${escapeHtml(p.responsable)}</td>
    <td style="font-size:12.5px;">${escapeHtml(p.proximaAccion)||'—'}</td>
    <td style="font-size:12px;">${p.fechaProximaAccion?fmtDateShort(p.fechaProximaAccion):'—'}</td>
    <td style="font-size:12.5px;">${escapeHtml(p.resultado)||'—'}</td>
    <td>${canEdit()?`<button class="btn btn-icon btn-ghost" data-action="delete-process" data-id="${p.id}">${ic('trash')}</button>`:''}</td>
  </tr>`).join(''):`<tr><td colspan="7"><div class="empty-state">${ic('briefcase')}<h4>Sin procesos activos</h4></div></td></tr>`}
  </tbody></table></div></div>`;
}
function tabCronologiaHtml(c){
  const items=[];
  clientFollowups(c.id).forEach(f=>items.push({fecha:f.fecha,text:`Seguimiento (${escapeHtml(f.canal)}): ${escapeHtml(f.motivo)} — ${escapeHtml(f.resultado)}`}));
  clientPagos(c.id).forEach(p=>items.push({fecha:p.fecha||p.proximaFecha,text:`Pago ${escapeHtml((p.estado||'').toLowerCase())}: ${escapeHtml(p.concepto)} (${fmtMoney(p.valorTotal)})`}));
  clientDocs(c.id).forEach(d=>items.push({fecha:d.fechaRecibido||d.fechaSolicitud,text:`Documento ${escapeHtml(d.tipo)}: ${escapeHtml(d.estado)}`}));
  clientNotes(c.id).forEach(n=>items.push({fecha:n.fecha,text:`Nota de ${escapeHtml(n.usuario)}: ${escapeHtml(n.contenido)}`}));
  clientProcesses(c.id).forEach(p=>items.push({fecha:p.fechaActualizacion||p.fechaInicio,text:`Proceso ${escapeHtml(p.tipo)}: ${escapeHtml(p.estado)}`}));
  items.push({fecha:c.fechaIngreso,text:`Cliente creado — servicio ${escapeHtml(c.servicio)} por ${fmtMoney(c.valorServicio)}`});
  items.sort((a,b)=>(b.fecha||'').localeCompare(a.fecha||''));
  return `<div class="card card-pad"><div class="timeline">${items.map(i=>`<div class="tl-item"><div class="tl-date">${fmtDate(i.fecha)}</div><div class="tl-text">${i.text}</div></div>`).join('')}</div></div>`;
}
function wireClientTabEvents(c){
  document.querySelectorAll('[data-doc-status]').forEach(s=>s.addEventListener('change',e=>{
    const doc = DB.state.documents.find(d=>d.id===s.getAttribute('data-doc-status')); if(!doc) return;
    doc.estado = e.target.value;
    if((doc.estado==='Recibido'||doc.estado==='Revisado') && !doc.fechaRecibido) doc.fechaRecibido = isoDate(todayDate());
    logActivity('documento', `Documento ${doc.tipo} de ${c.nombre} marcado como ${doc.estado}`, c.id);
    toast('Documento actualizado','ok'); commit();
  }));
  document.querySelectorAll('[data-pay-status]').forEach(s=>s.addEventListener('change',e=>{
    const pay = DB.state.payments.find(p=>p.id===s.getAttribute('data-pay-status')); if(!pay) return;
    pay.estado = e.target.value;
    if(pay.estado==='Aprobado'){ pay.valorPagado=pay.valorTotal; if(!pay.fecha) pay.fecha=isoDate(todayDate()); pay.proximaFecha=''; logActivity('pago',`Pago confirmado de ${c.nombre} (${fmtMoney(pay.valorTotal)})`,c.id); }
    toast('Pago actualizado','ok'); commit();
  }));
}
</script>
<script>
/* =====================================================================
   CLIENTE — add/edit form + CRUD actions
   ===================================================================== */
function allServicios(){ return CONFIG.servicios.concat(DB.state.config.serviciosExtra||[]); }

function openClientForm(id){
  const editing = !!id;
  const c = editing ? getClient(id) : null;
  const cr = c ? (c.credito||{}) : {};
  const html = `
    <div class="modal-head"><h2>${editing?'Editar cliente':'Agregar cliente'}</h2><button class="modal-close" onclick="closeModal()">${ic('x')}</button></div>
    <div class="modal-body">
      <form id="clientForm" onsubmit="return false;">
        <div class="form-section-title" style="margin-top:0;">Datos personales</div>
        <div class="field"><label>Nombre completo <span class="req">*</span></label><input type="text" id="cf_nombre" value="${escAttr(c?c.nombre:'')}"></div>
        <div class="field-row">
          <div class="field"><label>Teléfono <span class="req">*</span></label><input type="tel" id="cf_telefono" value="${escAttr(c?c.telefono:'')}" placeholder="+1 305 555 0100"><div class="field-hint" id="dupPhoneWarn"></div></div>
          <div class="field"><label>WhatsApp</label><input type="tel" id="cf_whatsapp" value="${escAttr(c?c.whatsapp:'')}"></div>
        </div>
        <div class="field-row">
          <div class="field"><label>Email</label><input type="email" id="cf_email" value="${escAttr(c?c.email:'')}"><div class="field-hint" id="dupEmailWarn"></div></div>
          <div class="field"><label>Fecha de nacimiento</label><input type="date" id="cf_fnac" value="${c?c.fechaNacimiento||'':''}"></div>
        </div>
        <div class="field-row">
          <div class="field"><label>Documento de identidad</label><input type="text" id="cf_doc" value="${escAttr(c?c.documentoId:'')}"></div>
          <div class="field"><label>Dirección</label><input type="text" id="cf_dir" value="${escAttr(c?c.direccion:'')}"></div>
        </div>

        <div class="form-section-title">Comercial</div>
        <div class="field-row-3">
          <div class="field"><label>Responsable</label><select id="cf_asesor">${DB.state.config.responsables.map(x=>`<option ${c&&c.asesor===x?'selected':''}>${x}</option>`).join('')}</select></div>
          <div class="field"><label>Fuente</label><select id="cf_fuente">${CONFIG.fuentes.map(x=>`<option ${c&&c.fuente===x?'selected':''}>${x}</option>`).join('')}</select></div>
          <div class="field"><label>Servicio</label><select id="cf_servicio">${allServicios().map(x=>`<option ${c&&c.servicio===x?'selected':''}>${x}</option>`).join('')}</select></div>
        </div>
        <div class="field-row-3">
          <div class="field"><label>Valor del servicio (USD)</label><input type="number" min="0" step="1" id="cf_valor" value="${c?c.valorServicio:''}"></div>
          <div class="field"><label>Método de pago</label><select id="cf_metodo">${CONFIG.metodosPago.map(x=>`<option ${c&&c.metodoPago===x?'selected':''}>${x}</option>`).join('')}</select></div>
          <div class="field"><label>Tarjeta — últimos 4 dígitos</label><input type="text" maxlength="4" id="cf_ult4" value="${escAttr(c?c.ultimos4Tarjeta:'')}" placeholder="0000"></div>
        </div>
        <div class="field"><label>Token / ID de tarjeta en la pasarela de pago (Stripe, Square, etc.)</label><input type="text" id="cf_token" value="${escAttr(c?c.tokenPasarela:'')}" placeholder="ej. cus_9f8s7d... o card_on_file_id"></div>
        <div class="field-hint" style="margin:-8px 0 14px;">Este CRM nunca guarda el número completo de la tarjeta ni el CVV — es una violación de las reglas de las redes de tarjetas (Visa/Mastercard) guardar el CVV después de la transacción, sin excepción, tenga o no autorización del cliente. Para cobros recurrentes sin pedir la tarjeta cada vez, usa el token que te da tu pasarela de pago (Stripe, Square, etc.) al procesar la primera transacción y pégalo aquí.</div>

        <div class="form-section-title">Estado y seguimiento</div>
        <div class="field-row-3">
          <div class="field"><label>Estado</label><select id="cf_estado">${CONFIG.estadosCliente.map(x=>`<option ${(c?c.estado:'Nuevo')===x?'selected':''}>${x}</option>`).join('')}</select></div>
          <div class="field"><label>Etapa</label><select id="cf_etapa">${CONFIG.etapas.map(x=>`<option ${(c?c.etapa:'Bienvenida')===x?'selected':''}>${x}</option>`).join('')}</select></div>
          <div class="field"><label>Fecha de ingreso</label><input type="date" id="cf_fingreso" value="${c?c.fechaIngreso:isoDate(todayDate())}"></div>
        </div>
        <div class="field-row">
          <div class="field"><label>Último contacto</label><input type="date" id="cf_ucontacto" value="${c?c.ultimoContacto||'':''}"></div>
          <div class="field"><label>Próximo seguimiento</label><input type="date" id="cf_pseguimiento" value="${c?c.proximoSeguimiento||'':''}"></div>
        </div>
        <div class="checkbox-row" style="margin-bottom:14px;"><input type="checkbox" id="cf_fav" ${c&&c.favorito?'checked':''}><label for="cf_fav" style="margin:0;">Marcar como favorito</label></div>
        <div class="field"><label>Etiquetas (separadas por coma)</label><input type="text" id="cf_tags" value="${escAttr(c?(c.etiquetas||[]).join(', '):'')}" placeholder="ej. urgente, hipoteca, vip"></div>
        <div class="field"><label>Carpeta Drive (enlace)</label><input type="text" id="cf_drive" value="${escAttr(c?c.carpetaDrive:'')}" placeholder="https://drive.google.com/..."></div>
        <div class="field"><label>Notas rápidas</label><textarea id="cf_notasrapidas">${c?escapeHtml(c.notasRapidas||''):''}</textarea></div>

        <div class="form-section-title">Información crediticia (opcional)</div>
        <div class="field"><label>Problema principal del crédito</label><textarea id="cf_problema">${escapeHtml(cr.problema||'')}</textarea></div>
        <div class="field"><label>Objetivo del cliente</label><textarea id="cf_objetivo">${escapeHtml(cr.objetivo||'')}</textarea></div>
        <div class="field"><label>Situación actual</label><input type="text" id="cf_situacion" value="${escAttr(cr.situacion||'')}"></div>
        <div class="field"><label>Tipos de cuentas negativas</label><div class="chip-select" id="cf_tiposNeg">${CONFIG.tiposCuentaNegativa.map(t=>`<div class="chip-opt ${((cr.tiposNegativos||[]).includes(t))?'sel':''}" data-chip="${escAttr(t)}">${t}</div>`).join('')}</div></div>
        <div class="field-row-3">
          <div class="field"><label>Score inicial</label><input type="text" id="cf_scoreini" value="${escAttr(cr.scoreInicial||'')}"></div>
          <div class="field"><label>Score actual</label><input type="text" id="cf_scoreact" value="${escAttr(cr.scoreActual||'')}"></div>
          <div class="field"><label>Fecha última revisión</label><input type="date" id="cf_frevision" value="${cr.fechaRevision||''}"></div>
        </div>
        <div class="field-hint">No se afirman ni prometen resultados específicos; estos campos son de seguimiento interno.</div>
      </form>
    </div>
    <div class="modal-foot"><button class="btn btn-secondary" onclick="closeModal()">Cancelar</button><button class="btn btn-primary" id="saveClientBtn">${ic('check2')}${editing?'Guardar cambios':'Crear cliente'}</button></div>`;
  openModal(html, 'lg');
  document.querySelectorAll('#cf_tiposNeg .chip-opt').forEach(ch=>ch.addEventListener('click',()=>ch.classList.toggle('sel')));
  if(!editing){
    document.getElementById('cf_telefono').addEventListener('blur', checkDupPhone);
    document.getElementById('cf_email').addEventListener('blur', checkDupEmail);
  }
  document.getElementById('saveClientBtn').addEventListener('click', ()=>saveClientForm(id));
}
function checkDupPhone(){
  const v=document.getElementById('cf_telefono').value.trim(); const warn=document.getElementById('dupPhoneWarn');
  if(!v){warn.textContent='';return;}
  const dup = DB.state.clients.find(c=>c.telefono && c.telefono.replace(/\D/g,'')===v.replace(/\D/g,'') && v.replace(/\D/g,'').length>4);
  warn.innerHTML = dup?`Ya existe un cliente con este teléfono: <strong>${escapeHtml(dup.nombre)}</strong>`:'';
  warn.style.color = dup?'var(--danger)':'';
}
function checkDupEmail(){
  const v=document.getElementById('cf_email').value.trim().toLowerCase(); const warn=document.getElementById('dupEmailWarn');
  if(!v){warn.textContent='';return;}
  const dup = DB.state.clients.find(c=>c.email && c.email.toLowerCase()===v);
  warn.innerHTML = dup?`Ya existe un cliente con este email: <strong>${escapeHtml(dup.nombre)}</strong>`:'';
  warn.style.color = dup?'var(--danger)':'';
}
function saveClientForm(id){
  const nombre = document.getElementById('cf_nombre').value.trim();
  const telefono = document.getElementById('cf_telefono').value.trim();
  if(!nombre || !telefono){ toast('Nombre y teléfono son obligatorios','err'); return; }
  const tags = document.getElementById('cf_tags').value.split(',').map(s=>s.trim()).filter(Boolean);
  const tiposNeg = Array.from(document.querySelectorAll('#cf_tiposNeg .chip-opt.sel')).map(x=>x.getAttribute('data-chip'));
  const data = {
    nombre, telefono,
    whatsapp: document.getElementById('cf_whatsapp').value.trim(),
    email: document.getElementById('cf_email').value.trim(),
    fechaNacimiento: document.getElementById('cf_fnac').value,
    documentoId: document.getElementById('cf_doc').value.trim(),
    direccion: document.getElementById('cf_dir').value.trim(),
    asesor: document.getElementById('cf_asesor').value,
    fuente: document.getElementById('cf_fuente').value,
    servicio: document.getElementById('cf_servicio').value,
    valorServicio: Number(document.getElementById('cf_valor').value)||0,
    metodoPago: document.getElementById('cf_metodo').value,
    ultimos4Tarjeta: document.getElementById('cf_ult4').value.replace(/\D/g,'').slice(0,4),
    tokenPasarela: document.getElementById('cf_token').value.trim(),
    estado: document.getElementById('cf_estado').value,
    etapa: document.getElementById('cf_etapa').value,
    fechaIngreso: document.getElementById('cf_fingreso').value || isoDate(todayDate()),
    ultimoContacto: document.getElementById('cf_ucontacto').value,
    proximoSeguimiento: document.getElementById('cf_pseguimiento').value,
    favorito: document.getElementById('cf_fav').checked,
    etiquetas: tags,
    carpetaDrive: document.getElementById('cf_drive').value.trim(),
    notasRapidas: document.getElementById('cf_notasrapidas').value.trim(),
    credito: {
      problema: document.getElementById('cf_problema').value.trim(),
      objetivo: document.getElementById('cf_objetivo').value.trim(),
      situacion: document.getElementById('cf_situacion').value.trim(),
      tiposNegativos: tiposNeg,
      scoreInicial: document.getElementById('cf_scoreini').value.trim(),
      scoreActual: document.getElementById('cf_scoreact').value.trim(),
      fechaRevision: document.getElementById('cf_frevision').value,
    }
  };
  if(id){
    const c = getClient(id);
    Object.assign(c, data);
    logActivity('cliente', `Datos de ${c.nombre} actualizados`, c.id);
    toast('Cliente actualizado','ok');
  } else {
    const newId = uid('client');
    const c = Object.assign({id:newId, demo:false, fechaVenta:data.fechaIngreso}, data);
    DB.state.clients.push(c);
    DB.state.sales.push({id:uid('sale'), clienteId:newId, fecha:data.fechaIngreso, servicio:data.servicio, valor:data.valorServicio, responsable:data.asesor, fuente:data.fuente, estado:'Confirmada', metodoPago:data.metodoPago, observaciones:''});
    logActivity('cliente', `${c.nombre} agregado como nuevo cliente`, c.id);
    toast('Cliente creado','ok');
    APP.clientDetailId = newId;
  }
  closeModal();
  commit();
}
function deleteClient(id){
  const c=getClient(id); if(!c) return;
  confirmDialog({title:'Eliminar cliente', text:`¿Eliminar a <strong>${escapeHtml(c.nombre)}</strong>? Se eliminarán también sus documentos, pagos, seguimientos y notas. Esta acción no se puede deshacer.`, okLabel:'Eliminar', danger:true, onConfirm:()=>{
    DB.state.clients = DB.state.clients.filter(x=>x.id!==id);
    DB.state.documents = DB.state.documents.filter(x=>x.clienteId!==id);
    DB.state.payments = DB.state.payments.filter(x=>x.clienteId!==id);
    DB.state.followups = DB.state.followups.filter(x=>x.clienteId!==id);
    DB.state.processes = DB.state.processes.filter(x=>x.clienteId!==id);
    DB.state.notes = DB.state.notes.filter(x=>x.clienteId!==id);
    DB.state.sales = DB.state.sales.filter(x=>x.clienteId!==id);
    if(APP.clientDetailId===id) APP.clientDetailId=null;
    logActivity('cliente', `${c.nombre} eliminado del CRM`, null);
    toast('Cliente eliminado','ok');
    commit();
  }});
}
function toggleFavorite(id){ const c=getClient(id); if(!c) return; c.favorito=!c.favorito; commit(); }
function setClientEtapa(clientId, etapa){
  const c=getClient(clientId); if(!c||c.etapa===etapa) return;
  c.etapa=etapa;
  logActivity('estado', `${c.nombre} avanzó a la etapa "${etapa}"`, c.id);
  toast('Etapa actualizada a '+etapa,'ok');
  commit();
}

  const ta=document.getElementById('newNoteText'); const text= ta?ta.value.trim():'';

/* --- CSV export / import for clients --- */
function exportClientsCsv(){
  const headers=['ID','Nombre','Telefono','WhatsApp','Email','Estado','Etapa','Servicio','Responsable','Fuente','Fecha_ingreso','Ultimo_contacto','Proximo_seguimiento','Valor_servicio','Pagado','Saldo','Riesgo'];
  const rows = filteredClients().map(c=>[c.id,c.nombre,c.telefono,c.whatsapp,c.email,c.estado,c.etapa,c.servicio,c.asesor,c.fuente,c.fechaIngreso,c.ultimoContacto,c.proximoSeguimiento,c.valorServicio,clientTotalPagado(c.id),clientSaldo(c),computeRisk(c)||'']);
  exportCsv('creditplus_clientes.csv', headers, rows);
}
function startImportClients(){
  const input=document.getElementById('csvFileInput'); input.value='';
  input.onchange=(e)=>{
    const file=e.target.files[0]; if(!file) return;
    const reader=new FileReader();
    reader.onload=()=>{ const rows=parseCsv(reader.result); if(!rows.length){ toast('El archivo está vacío','err'); return; } openImportMappingModal(rows); };
    reader.readAsText(file);
  };
  input.click();
}
function openImportMappingModal(rows){
  const headerRow=rows[0]; const dataRows=rows.slice(1);
  const targetFields=[{k:'',l:'(No importar)'},{k:'nombre',l:'Nombre completo'},{k:'telefono',l:'Teléfono'},{k:'whatsapp',l:'WhatsApp'},{k:'email',l:'Email'},{k:'asesor',l:'Responsable'},{k:'fuente',l:'Fuente'},{k:'servicio',l:'Servicio'},{k:'valorServicio',l:'Valor del servicio'},{k:'estado',l:'Estado'},{k:'etapa',l:'Etapa'},{k:'fechaIngreso',l:'Fecha de ingreso'},{k:'direccion',l:'Dirección'},{k:'documentoId',l:'Documento ID'}];
  const guess=(h)=>{ const hl=(h||'').toLowerCase(); const f=targetFields.find(f=>f.k && (hl.includes(f.k.toLowerCase())||hl.includes(f.l.toLowerCase().split(' ')[0]))); return f?f.k:''; };
  const html=`<div class="modal-head"><h2>Importar clientes</h2><button class="modal-close" onclick="closeModal()">${ic('x')}</button></div>
  <div class="modal-body">
    <p style="font-size:12.5px;color:var(--ink-soft);">Detectamos ${headerRow.length} columnas y ${dataRows.length} filas. Indica a qué campo de CreditPlus corresponde cada columna.</p>
    <div class="table-wrap"><table class="dtable"><thead><tr><th>Columna del archivo</th><th>Ejemplo</th><th>Campo en CreditPlus</th></tr></thead><tbody>
    ${headerRow.map((h,i)=>`<tr><td style="font-weight:600;">${escapeHtml(h)}</td><td class="cell-sub">${escapeHtml((dataRows[0]||[])[i]||'')}</td><td><select data-map-col="${i}">${targetFields.map(f=>`<option value="${f.k}" ${guess(h)===f.k?'selected':''}>${f.l}</option>`).join('')}</select></td></tr>`).join('')}
    </tbody></table></div>
  </div>
  <div class="modal-foot"><button class="btn btn-secondary" onclick="closeModal()">Cancelar</button><button class="btn btn-primary" id="doImportBtn">${ic('upload')}Importar ${dataRows.length} clientes</button></div>`;
  openModal(html,'lg');
  document.getElementById('doImportBtn').addEventListener('click', ()=>{
    const mapping={};
    document.querySelectorAll('[data-map-col]').forEach(s=>{ const col=Number(s.getAttribute('data-map-col')); if(s.value) mapping[col]=s.value; });
    if(!Object.values(mapping).includes('nombre')){ toast('Debes mapear al menos la columna Nombre','err'); return; }
    let count=0;
    dataRows.forEach(row=>{
      if(!row.some(v=>v && v.trim())) return;
      const obj={}; Object.keys(mapping).forEach(col=>{ obj[mapping[col]]=row[Number(col)]; });
      if(!obj.nombre || !obj.nombre.trim()) return;
      const newId=uid('client');
      const client={ id:newId, demo:false, nombre:obj.nombre.trim(), telefono:obj.telefono||'', whatsapp:obj.whatsapp||obj.telefono||'', email:obj.email||'',
        fechaNacimiento:'', documentoId:obj.documentoId||'', direccion:obj.direccion||'',
        asesor: DB.state.config.responsables.includes(obj.asesor)?obj.asesor:DB.state.config.responsables[0],
        fuente: CONFIG.fuentes.includes(obj.fuente)?obj.fuente:'Otro',
        servicio: allServicios().includes(obj.servicio)?obj.servicio:CONFIG.servicios[0],
        valorServicio: Number(obj.valorServicio)||0, metodoPago:'Zelle', ultimos4Tarjeta:'', tokenPasarela:'', favorito:false, etiquetas:['importado'],
        carpetaDrive:'', notasRapidas:'', motivoRiesgo:'',
        estado: CONFIG.estadosCliente.includes(obj.estado)?obj.estado:'Nuevo',
        etapa: CONFIG.etapas.includes(obj.etapa)?obj.etapa:'Bienvenida',
        fechaVenta: obj.fechaIngreso||isoDate(todayDate()), fechaIngreso: obj.fechaIngreso||isoDate(todayDate()),
        ultimoContacto:'', proximoSeguimiento:'',
        credito:{problema:'',objetivo:'',situacion:'',tiposNegativos:[],scoreInicial:'',scoreActual:'',fechaRevision:''} };
      DB.state.clients.push(client);
      DB.state.sales.push({id:uid('sale'),clienteId:newId,fecha:client.fechaIngreso,servicio:client.servicio,valor:client.valorServicio,responsable:client.asesor,fuente:client.fuente,estado:'Confirmada',metodoPago:client.metodoPago,observaciones:'Importado desde CSV'});
      count++;
    });
    logActivity('cliente', `${count} clientes importados desde CSV`, null);
    closeModal(); toast(count+' clientes importados','ok'); commit();
  });
}
</script>
<script>
/* =====================================================================
   LEADS — table + kanban
   ===================================================================== */
function filteredLeads(){
  let list = scoped(DB.state.leads,'responsable').slice();
  const f = APP.leadFilters;
  if(f.q){ const q=f.q.toLowerCase(); list=list.filter(l=>l.nombre.toLowerCase().includes(q)||(l.telefono||'').includes(q)||(l.email||'').toLowerCase().includes(q)); }
  if(f.estado) list=list.filter(l=>l.estado===f.estado);
  if(f.fuente) list=list.filter(l=>l.fuente===f.fuente);
  if(f.responsable) list=list.filter(l=>l.responsable===f.responsable);
  list.sort((a,b)=>(b.fechaLead||'').localeCompare(a.fechaLead||''));
  return list;
}
function renderLeads(){
  const el = document.getElementById('view-leads');
  const list = filteredLeads();
  el.innerHTML = `
    <div class="view-head">
      <div><h1>Leads</h1><p>${DB.state.leads.length} prospectos registrados${isAsesor()?' · mostrando solo los tuyos':''}</p></div>
      <div class="view-actions">
        <div class="seg-toggle"><button class="${APP.leadsView==='table'?'active':''}" data-leads-view="table">Tabla</button><button class="${APP.leadsView==='kanban'?'active':''}" data-leads-view="kanban">Kanban</button></div>
        <button class="btn btn-secondary" data-action="export-leads">${ic('download')}Exportar</button>
        ${canEdit()?`<button class="btn btn-primary" data-action="open-lead-form">${ic('plus')}Agregar lead</button>`:''}
      </div>
    </div>
    <div class="filter-bar">
      <div class="search-mini"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg><input type="text" id="leadSearch" placeholder="Buscar nombre, teléfono o email" value="${escAttr(APP.leadFilters.q||'')}"></div>
      <select id="lfEstado"><option value="">Estado (todos)</option>${CONFIG.estadosLead.map(x=>`<option ${APP.leadFilters.estado===x?'selected':''}>${x}</option>`).join('')}</select>
      <select id="lfFuente"><option value="">Fuente (todas)</option>${CONFIG.fuentes.map(x=>`<option ${APP.leadFilters.fuente===x?'selected':''}>${x}</option>`).join('')}</select>
      <select id="lfResp"><option value="">Responsable (todos)</option>${DB.state.config.responsables.map(x=>`<option ${APP.leadFilters.responsable===x?'selected':''}>${x}</option>`).join('')}</select>
    </div>
    <div id="leadsBody"></div>`;
  wireLeadFilterEvents();
  document.getElementById('leadsBody').innerHTML = APP.leadsView==='kanban' ? leadsKanbanHtml(list) : leadsTableHtml(list);
  if(APP.leadsView==='kanban') wireLeadKanbanDnD();
}
function wireLeadFilterEvents(){

function wireLeadKanbanDnD(){
  let draggedId=null;
  document.querySelectorAll('.kanban-card[data-kanban-lead]').forEach(card=>{
    card.addEventListener('dragstart', ()=>{ draggedId=card.getAttribute('data-kanban-lead'); });
  });
  document.querySelectorAll('.kanban-cards[data-kanban-col]').forEach(col=>{
    col.addEventListener('dragover', e=>{ e.preventDefault(); col.classList.add('dragover'); });
    col.addEventListener('dragleave', ()=>col.classList.remove('dragover'));
    col.addEventListener('drop', e=>{
      e.preventDefault(); col.classList.remove('dragover');
      if(!canEdit()){ toast('Tu rol no permite mover leads','err'); return; }
      const newEstado = col.getAttribute('data-kanban-col');
      const lead = getLead(draggedId);
      if(lead && lead.estado!==newEstado){
        lead.estado=newEstado;
        logActivity('lead', `${lead.nombre} movido a "${newEstado}"`, null);
        toast(lead.nombre+' → '+newEstado,'ok');
        commit();
      }
    });
  });
}

function saveLeadForm(id){
  const nombre=document.getElementById('lf_nombre').value.trim();
  if(!nombre){ toast('El nombre es obligatorio','err'); return; }
  const data={ nombre, telefono:document.getElementById('lf_telefono').value.trim(), whatsapp:document.getElementById('lf_whatsapp').value.trim(),
    email:document.getElementById('lf_email').value.trim(), fuente:document.getElementById('lf_fuente').value, estado:document.getElementById('lf_estado').value,
    responsable:document.getElementById('lf_resp').value, campana:document.getElementById('lf_campana').value.trim(), problema:document.getElementById('lf_problema').value.trim(),
    fechaLead:document.getElementById('lf_fecha').value||isoDate(todayDate()), proximoSeguimiento:document.getElementById('lf_proximo').value, notas:document.getElementById('lf_notas').value.trim() };
  if(id){ Object.assign(getLead(id), data); toast('Lead actualizado','ok'); logActivity('lead', `Lead ${data.nombre} actualizado`, null); }
  else { const newId=uid('lead'); DB.state.leads.push(Object.assign({id:newId, demo:false, ultimoContacto:''}, data)); toast('Lead creado','ok'); logActivity('lead', `${data.nombre} agregado como nuevo lead`, null); }
  closeModal(); commit();
}
function deleteLead(id){
  const l=getLead(id); if(!l) return;
  confirmDialog({title:'Eliminar lead', text:`¿Eliminar a <strong>${escapeHtml(l.nombre)}</strong> de los leads?`, okLabel:'Eliminar', onConfirm:()=>{
    DB.state.leads=DB.state.leads.filter(x=>x.id!==id); toast('Lead eliminado','ok'); commit();
  }});
}

  const l=getLead(id); if(!l) return;
  closeModal();
  l.estado='Venta';

  setTimeout(()=>{

    if(l.responsable && DB.state.config.responsables.includes(l.responsable)) set('cf_asesor', l.responsable);

  },0);
  toast('Datos del lead cargados — completa el resto para crear el cliente','ok');

        <div class="cell-sub">${c?escapeHtml(c.nombre):'Sin cliente'}</div>
        <div class="kc-meta"><span class="badge b-${COLOR_PRIORIDAD[t.prioridad]||'gray'}">${t.prioridad}</span><span>${t.fechaLimite?fmtDateShort(t.fechaLimite):''}</span></div>
      </div>`; }).join('')}
    </div></div>`;
  }).join('')}</div>`;
}
function wireTaskKanbanDnD(){
  let draggedId=null;
  document.querySelectorAll('.kanban-card[data-kanban-task]').forEach(card=>{ card.addEventListener('dragstart',()=>{ draggedId=card.getAttribute('data-kanban-task'); }); });
  document.querySelectorAll('.kanban-cards[data-task-col]').forEach(col=>{
    col.addEventListener('dragover', e=>{ e.preventDefault(); col.classList.add('dragover'); });
    col.addEventListener('dragleave', ()=>col.classList.remove('dragover'));
    col.addEventListener('drop', e=>{
      e.preventDefault(); col.classList.remove('dragover');
      const newEstado = col.getAttribute('data-task-col');
      const t = DB.state.tasks.find(x=>x.id===draggedId);
      if(t && t.estado!==newEstado){ t.estado=newEstado; logActivity('tarea', `Tarea "${t.titulo}" movida a "${newEstado}"`, t.clienteId||null); commit(); }
    });
  });
}
function toggleTaskDone(id, checked){
  const t = DB.state.tasks.find(x=>x.id===id); if(!t) return;
  t.estado = checked?'Completada':'Pendiente';
  logActivity('tarea', `Tarea "${t.titulo}" marcada como ${t.estado}`, t.clienteId||null);
  commit();
}
function openTaskForm(id){
  const editing=!!id; const t=editing?DB.state.tasks.find(x=>x.id===id):null;
  const html=`<div class="modal-head"><h2>${editing?'Editar tarea':'Agregar tarea'}</h2><button class="modal-close" onclick="closeModal()">${ic('x')}</button></div>
  <div class="modal-body">
    <div class="field"><label>Título</label><input type="text" id="tf_titulo" value="${escAttr(t?t.titulo:'')}"></div>
    <div class="field"><label>Descripción</label><textarea id="tf_desc">${t?escapeHtml(t.descripcion||''):''}</textarea></div>
    <div class="field"><label>Cliente relacionado (opcional)</label><select id="tf_cliente"><option value="">— Ninguno —</option>${DB.state.clients.map(c=>`<option value="${c.id}" ${t&&t.clienteId===c.id?'selected':''}>${escapeHtml(c.nombre)}</option>`).join('')}</select></div>
    <div class="field-row-3">
      <div class="field"><label>Responsable</label><select id="tf_resp">${DB.state.config.responsables.map(x=>`<option ${t&&t.responsable===x?'selected':''}>${x}</option>`).join('')}</select></div>
      <div class="field"><label>Prioridad</label><select id="tf_prioridad">${CONFIG.prioridades.map(x=>`<option ${(t?t.prioridad:'Media')===x?'selected':''}>${x}</option>`).join('')}</select></div>
      <div class="field"><label>Fecha límite</label><input type="date" id="tf_fecha" value="${t?(t.fechaLimite||''):isoDate(todayDate())}"></div>
    </div>
    <div class="field"><label>Estado</label><select id="tf_estado">${CONFIG.estadosTarea.map(x=>`<option ${(t?t.estado:'Pendiente')===x?'selected':''}>${x}</option>`).join('')}</select></div>
  </div>
  <div class="modal-foot"><button class="btn btn-secondary" onclick="closeModal()">Cancelar</button><button class="btn btn-primary" id="saveTaskBtn">${ic('check2')}${editing?'Guardar cambios':'Crear tarea'}</button></div>`;
  openModal(html);
  document.getElementById('saveTaskBtn').addEventListener('click', ()=>{
    const titulo=document.getElementById('tf_titulo').value.trim();
    if(!titulo){ toast('El título es obligatorio','err'); return; }
    const data={ titulo, descripcion:document.getElementById('tf_desc').value.trim(), clienteId:document.getElementById('tf_cliente').value, responsable:document.getElementById('tf_resp').value, prioridad:document.getElementById('tf_prioridad').value, fechaLimite:document.getElementById('tf_fecha').value, estado:document.getElementById('tf_estado').value };
    if(id){ Object.assign(t, data); toast('Tarea actualizada','ok'); }
    else { DB.state.tasks.push(Object.assign({id:uid('task')}, data)); toast('Tarea creada','ok'); }
    closeModal(); commit();
  });
}
function deleteTask(id){ confirmDialog({title:'Eliminar tarea', text:'¿Eliminar esta tarea?', okLabel:'Eliminar', onConfirm:()=>{ DB.state.tasks=DB.state.tasks.filter(t=>t.id!==id); toast('Tarea eliminada','ok'); commit(); }}); }
</script>
<script>
/* =====================================================================
   CALENDARIO
   ===================================================================== */
function getCalendarItemsForMonth(){
  const items = {};
  const add=(dateStr,label,type,ref)=>{ if(!dateStr) return; if(!items[dateStr]) items[dateStr]=[]; items[dateStr].push({label,type,ref}); };
  scoped(DB.state.clients,'asesor').forEach(c=>{ if(c.proximoSeguimiento && !['Cancelado','Finalizado'].includes(c.estado)) add(c.proximoSeguimiento, 'Seguimiento: '+c.nombre, 'seguimiento', c.id); });
  scoped(DB.state.tasks,'responsable').forEach(t=>{ if(t.fechaLimite && t.estado!=='Completada') add(t.fechaLimite, 'Tarea: '+t.titulo, 'tarea', t.id); });
  DB.state.payments.forEach(p=>{ if(p.proximaFecha && !['Aprobado','Reembolsado'].includes(p.estado)){ const c=getClient(p.clienteId); add(p.proximaFecha, 'Pago: '+(c?c.nombre:''), 'pago', p.id); } });
  DB.state.events.forEach(e=>add(e.fecha, e.titulo, 'evento', e.id));
  return items;
}
function calColor(type){ return {seguimiento:'#0E7C86',tarea:'#C6821F',pago:'#B3432F',evento:'#0F2A4A'}[type]||'#0F2A4A'; }
function addMonths(iso,n){ const d=new Date(iso+'T00:00:00'); d.setDate(1); d.setMonth(d.getMonth()+n); return isoDate(d); }
function renderCalendario(){
  const el = document.getElementById('view-calendario');
  const cursor = new Date(APP.calCursor+'T00:00:00');
  const year=cursor.getFullYear(), month=cursor.getMonth();
  const items = getCalendarItemsForMonth();
  const firstDay = new Date(year,month,1);
  const startOffset = firstDay.getDay();
  const daysInMonth = new Date(year,month+1,0).getDate();
  const daysInPrevMonth = new Date(year,month,0).getDate();
  const todayIso = isoDate(todayDate());
  const monthLabel = firstDay.toLocaleDateString('es-ES',{month:'long',year:'numeric'});
  let cells='';
  for(let i=0;i<startOffset;i++){ const d=daysInPrevMonth-startOffset+1+i; cells += `<div class="cal-cell other-month"><div class="cal-daynum">${d}</div></div>`; }
  for(let d=1; d<=daysInMonth; d++){
    const dateStr = `${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const dayItems = items[dateStr]||[];
    const isToday = dateStr===todayIso;
    cells += `<div class="cal-cell ${isToday?'today':''}" data-cal-day="${dateStr}">
      <div class="cal-daynum">${d}</div>
      ${dayItems.slice(0,3).map(it=>`<div class="cal-evt" style="background:${calColor(it.type)}22;color:${calColor(it.type)};">${escapeHtml(it.label)}</div>`).join('')}
      ${dayItems.length>3?`<div class="cal-evt" style="color:var(--ink-faint);background:none;padding-left:0;">+${dayItems.length-3} más</div>`:''}
    </div>`;
  }
  const totalCells = startOffset+daysInMonth;
  const trailing = (7-(totalCells%7))%7;
  for(let i=1;i<=trailing;i++){ cells += `<div class="cal-cell other-month"><div class="cal-daynum">${i}</div></div>`; }
  el.innerHTML = `
    <div class="view-head"><div><h1>Calendario</h1><p>Seguimientos, tareas y pagos programados</p></div>
      <div class="view-actions"><button class="btn btn-primary" data-action="open-event-form">${ic('plus')}Agregar evento</button></div>
    </div>
    <div class="card card-pad">
      <div class="cal-head">
        <button class="btn btn-secondary btn-icon" id="calPrev">${ic('chevronL')}</button>
        <h3 style="margin:0;text-transform:capitalize;">${monthLabel}</h3>
        <button class="btn btn-secondary btn-icon" id="calNext">${ic('chevronR')}</button>
      </div>
      <div class="cal-grid">${['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'].map(d=>`<div class="cal-dow">${d}</div>`).join('')}${cells}</div>
    </div>`;
  document.getElementById('calPrev').addEventListener('click', ()=>{ APP.calCursor=addMonths(APP.calCursor,-1); renderCalendario(); });
  document.getElementById('calNext').addEventListener('click', ()=>{ APP.calCursor=addMonths(APP.calCursor,1); renderCalendario(); });
  document.querySelectorAll('[data-cal-day]').forEach(cell=>cell.addEventListener('click', ()=>{ const ds=cell.getAttribute('data-cal-day'); openDayModal(ds, items[ds]||[]); }));
}
function openDayModal(dateStr, items){
  const html=`<div class="modal-head"><h2>${fmtDate(dateStr)}</h2><button class="modal-close" onclick="closeModal()">${ic('x')}</button></div>
  <div class="modal-body">
    ${items.length?items.map(it=>`<div class="alert-item" style="padding:9px 0;cursor:pointer;" data-cal-item-open="${it.type}:${it.ref}"><span class="alert-dot dot-${it.type==='pago'?'danger':(it.type==='tarea'?'gold':(it.type==='seguimiento'?'teal':'navy'))}"></span><div><div class="t">${escapeHtml(it.label)}</div><div class="d">${it.type}</div></div></div>`).join(''):'<p style="color:var(--ink-faint);font-size:13px;">Sin eventos este día.</p>'}
  </div>
  <div class="modal-foot"><button class="btn btn-secondary" onclick="closeModal()">Cerrar</button><button class="btn btn-primary" data-action="open-event-form" data-date="${dateStr}">${ic('plus')}Agregar evento</button></div>`;
  openModal(html);
  document.querySelectorAll('[data-cal-item-open]').forEach(x=>x.addEventListener('click', ()=>{
    const parts = x.getAttribute('data-cal-item-open').split(':'); const type=parts[0]; const ref=parts.slice(1).join(':');
    closeModal();
    if(type==='seguimiento') openClientDetail(ref);
    else if(type==='pago'){ const p=DB.state.payments.find(pp=>pp.id===ref); if(p) openClientDetail(p.clienteId); }
    else if(type==='tarea') openTaskForm(ref);
  }));
}
function openEventForm(dateStr){
  const html=`<div class="modal-head"><h2>Agregar evento</h2><button class="modal-close" onclick="closeModal()">${ic('x')}</button></div>
  <div class="modal-body">
    <div class="field"><label>Título</label><input type="text" id="ef_titulo"></div>
    <div class="field-row"><div class="field"><label>Fecha</label><input type="date" id="ef_fecha" value="${dateStr||isoDate(todayDate())}"></div><div class="field"><label>Hora</label><input type="time" id="ef_hora"></div></div>
    <div class="field"><label>Tipo</label><select id="ef_tipo"><option>Llamada</option><option>Reunión</option><option>Recordatorio</option><option>Otro</option></select></div>
    <div class="field"><label>Cliente relacionado (opcional)</label><select id="ef_cliente"><option value="">— Ninguno —</option>${DB.state.clients.map(c=>`<option value="${c.id}">${escapeHtml(c.nombre)}</option>`).join('')}</select></div>
    <div class="field"><label>Notas</label><textarea id="ef_notas"></textarea></div>
  </div>
  <div class="modal-foot"><button class="btn btn-secondary" onclick="closeModal()">Cancelar</button><button class="btn btn-primary" id="saveEventBtn">${ic('plus')}Agregar</button></div>`;
  openModal(html);
  document.getElementById('saveEventBtn').addEventListener('click', ()=>{
    const titulo=document.getElementById('ef_titulo').value.trim();
    if(!titulo){ toast('El título es obligatorio','err'); return; }
    DB.state.events.push({id:uid('event'), titulo, fecha:document.getElementById('ef_fecha').value, hora:document.getElementById('ef_hora').value, tipo:document.getElementById('ef_tipo').value, clienteId:document.getElementById('ef_cliente').value, notas:document.getElementById('ef_notas').value.trim()});
    closeModal(); toast('Evento agregado','ok'); commit();
  });
}

/* =====================================================================
   VENTAS
   ===================================================================== */
function renderVentas(){
  const el = document.getElementById('view-ventas');
  const sales = scoped(DB.state.sales,'responsable').slice().sort((a,b)=>(b.fecha||'').localeCompare(a.fecha||''));
  const today = isoDate(todayDate());
  const curMonth = today.slice(0,7), curYear = today.slice(0,4);
  const ventasMes = sales.filter(s=>(s.fecha||'').slice(0,7)===curMonth);
  const ventasAno = sales.filter(s=>(s.fecha||'').slice(0,4)===curYear);
  const activas = sales.filter(s=>s.estado!=='Cancelada');
  const ingresos = activas.reduce((sum,s)=>sum+Number(s.valor||0),0);
  const ticketProm = activas.length? Math.round(ingresos/activas.length) : 0;
  el.innerHTML = `
    <div class="view-head"><div><h1>Ventas</h1><p>${sales.length} ventas registradas</p></div>
      <div class="view-actions"><button class="btn btn-secondary" data-action="export-sales">${ic('download')}Exportar</button></div></div>
    <div class="grid grid-kpi" style="margin-bottom:18px;grid-template-columns:repeat(4,1fr);">
      <div class="card kpi"><div class="kpi-top"><div class="kpi-icon c-navy">${ICONS.dollar}</div></div><div class="kpi-value">${ventasMes.length}</div><div class="kpi-label">Ventas del mes</div></div>
      <div class="card kpi"><div class="kpi-top"><div class="kpi-icon c-teal">${ICONS.chart}</div></div><div class="kpi-value">${ventasAno.length}</div><div class="kpi-label">Ventas del año</div></div>
      <div class="card kpi"><div class="kpi-top"><div class="kpi-icon c-gold">${ICONS.trend}</div></div><div class="kpi-value">${fmtMoney(ingresos)}</div><div class="kpi-label">Ingresos totales</div></div>
      <div class="card kpi"><div class="kpi-top"><div class="kpi-icon c-navy">${ICONS.gauge}</div></div><div class="kpi-value">${fmtMoney(ticketProm)}</div><div class="kpi-label">Ticket promedio</div></div>
    </div>
    <div class="grid grid-2" style="margin-bottom:18px;">
      <div class="card"><div class="card-head"><h3>Ventas por fuente</h3></div><div class="card-pad"><canvas id="chartVentasFuente" height="170"></canvas></div></div>
      <div class="card"><div class="card-head"><h3>Ventas por responsable</h3></div><div class="card-pad"><canvas id="chartVentasResp" height="170"></canvas></div></div>
    </div>
    <div class="card"><div class="table-wrap"><table class="dtable"><thead><tr><th>Cliente</th><th>Fecha</th><th>Servicio</th><th>Valor</th><th>Responsable</th><th>Fuente</th><th>Estado</th><th>Método</th></tr></thead><tbody>
    ${sales.length?sales.map(s=>{ const c=getClient(s.clienteId); return `<tr>
      <td>${c?`<span class="cell-name" data-open-client="${s.clienteId}">${escapeHtml(c.nombre)}</span>`:'<span class="cell-sub">—</span>'}</td>
      <td style="font-size:12px;">${fmtDateShort(s.fecha)}</td>
      <td style="font-size:12.5px;">${escapeHtml(s.servicio)}</td>
      <td style="font-weight:700;font-size:12.5px;color:var(--navy);">${fmtMoney(s.valor)}</td>
      <td style="font-size:12.5px;">${escapeHtml(s.responsable)}</td>
      <td style="font-size:12.5px;">${escapeHtml(s.fuente)}</td>
      <td><span class="badge b-${s.estado==='Cancelada'?'danger':'teal'}">${s.estado}</span></td>
      <td style="font-size:12.5px;">${escapeHtml(s.metodoPago)||'—'}</td>
    </tr>`; }).join(''):`<tr><td colspan="8"><div class="empty-state">${ic('dollar')}<h4>Sin ventas registradas</h4></div></td></tr>`}
    </tbody></table></div></div>`;
  renderVentasCharts(sales);
}
function renderVentasCharts(sales){
  if(typeof Chart==='undefined') return;
  const palette=['#0F2A4A','#0E7C86','#E8A33D','#C6821F','#8494A6','#B3432F','#54677E','#0A1F38','#F0C888'];
  makeChart('chartVentasFuente', { type:'bar', data:{labels:CONFIG.fuentes, datasets:[{data:CONFIG.fuentes.map(f=>sales.filter(s=>s.fuente===f).length), backgroundColor:'#0E7C86', borderRadius:5}]}, options:{maintainAspectRatio:false, plugins:{legend:{display:false}}, scales:{y:{beginAtZero:true,grid:{display:false},ticks:{precision:0}},x:{grid:{display:false}}}} });
  makeChart('chartVentasResp', { type:'doughnut', data:{labels:DB.state.config.responsables, datasets:[{data:DB.state.config.responsables.map(r=>sales.filter(s=>s.responsable===r).length), backgroundColor:palette, borderWidth:0}]}, options:{maintainAspectRatio:false, plugins:{legend:{position:'bottom'}}, cutout:'62%'} });
}
function exportSalesCsv(){
  const headers=['ID','Cliente','Fecha','Servicio','Valor','Responsable','Fuente','Estado','Metodo','Observaciones'];
  const rows = DB.state.sales.map(s=>{ const c=getClient(s.clienteId); return [s.id, c?c.nombre:'', s.fecha, s.servicio, s.valor, s.responsable, s.fuente, s.estado, s.metodoPago, s.observaciones]; });
  exportCsv('creditplus_ventas.csv', headers, rows);
}

/* =====================================================================
   PAGOS
   ===================================================================== */
function renderPagos(){
  const el = document.getElementById('view-pagos');
  const today = isoDate(todayDate());
  APP.paymentFilters = APP.paymentFilters||{};
  const f = APP.paymentFilters;
  let list = DB.state.payments.slice();
  if(f.estado) list = list.filter(p=>p.estado===f.estado);
  if(f.q){ const q=f.q.toLowerCase(); list = list.filter(p=>{ const c=getClient(p.clienteId); return c && c.nombre.toLowerCase().includes(q); }); }
  list.sort((a,b)=>(a.proximaFecha||a.fecha||'9999').localeCompare(b.proximaFecha||b.fecha||'9999'));
  const totalPend = DB.state.payments.filter(p=>['Pendiente','Vencido','Fallido'].includes(p.estado)).reduce((s,p)=>s+Number(p.valorTotal||0),0);
  const totalPagadoMes = DB.state.payments.filter(p=>p.estado==='Aprobado' && (p.fecha||'').slice(0,7)===today.slice(0,7)).reduce((s,p)=>s+Number(p.valorTotal||0),0);
  const vencidos = DB.state.payments.filter(p=>p.estado==='Vencido' || (p.proximaFecha && p.proximaFecha<today && !['Aprobado','Reembolsado'].includes(p.estado))).length;
  el.innerHTML = `
    <div class="view-head"><div><h1>Pagos</h1><p>Control financiero de membresías y servicios</p></div>
      <div class="view-actions">
        <button class="btn btn-secondary" data-action="export-payments">${ic('download')}Exportar</button>
        ${canEdit()?`<button class="btn btn-primary" data-action="open-payment-form-global">${ic('plus')}Registrar pago</button>`:''}
      </div></div>
    <div class="grid" style="grid-template-columns:repeat(3,1fr);margin-bottom:18px;">
      <div class="card kpi"><div class="kpi-top"><div class="kpi-icon c-danger">${ICONS.card}</div></div><div class="kpi-value">${fmtMoney(totalPend)}</div><div class="kpi-label">Total pendiente por cobrar</div></div>
      <div class="card kpi"><div class="kpi-top"><div class="kpi-icon c-teal">${ICONS.trend}</div></div><div class="kpi-value">${fmtMoney(totalPagadoMes)}</div><div class="kpi-label">Cobrado este mes</div></div>
      <div class="card kpi"><div class="kpi-top"><div class="kpi-icon c-danger">${ICONS.alert}</div></div><div class="kpi-value">${vencidos}</div><div class="kpi-label">Pagos vencidos</div></div>
    </div>
    <div class="filter-bar">
      <div class="search-mini"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg><input type="text" id="payClienteSearch" placeholder="Buscar cliente" value="${escAttr(f.q||'')}"></div>
      <select id="payEstado"><option value="">Estado (todos)</option>${CONFIG.estadosPago.map(x=>`<option ${f.estado===x?'selected':''}>${x}</option>`).join('')}</select>
    </div>
    <div class="card"><div class="table-wrap"><table class="dtable"><thead><tr><th>Cliente</th><th>Concepto</th><th>Valor</th><th>Estado</th><th>Fecha</th><th>Próx. fecha</th><th>Método</th><th></th></tr></thead><tbody>
    ${list.length?list.map(p=>{ const c=getClient(p.clienteId); const overdue=(p.estado==='Vencido'||(p.proximaFecha&&p.proximaFecha<today&&!['Aprobado','Reembolsado'].includes(p.estado)));
      return `<tr class="${overdue?'overdue-row':''}">
      <td>${c?`<span class="cell-name" data-open-client="${p.clienteId}">${escapeHtml(c.nombre)}</span>`:'<span class="cell-sub">Cliente eliminado</span>'}</td>
      <td style="font-size:12.5px;">${escapeHtml(p.concepto)}</td>
      <td style="font-weight:700;font-size:12.5px;">${fmtMoney(p.valorTotal)}</td>
      <td>${canEdit()?`<select data-pay-status-global="${p.id}">${CONFIG.estadosPago.map(x=>`<option ${p.estado===x?'selected':''}>${x}</option>`).join('')}</select>`:`<span class="badge b-${COLOR_PAGO[p.estado]||'gray'}">${p.estado}</span>`}</td>
      <td style="font-size:12px;">${p.fecha?fmtDateShort(p.fecha):'—'}</td>
      <td style="font-size:12px;${overdue?'color:var(--danger);font-weight:700;':''}">${p.proximaFecha?fmtDateShort(p.proximaFecha):'—'}</td>
      <td style="font-size:12.5px;">${escapeHtml(p.metodo)}</td>
      <td>${canEdit()?`<button class="btn btn-icon btn-ghost" data-action="delete-payment" data-id="${p.id}">${ic('trash')}</button>`:''}</td>
    </tr>`; }).join(''):`<tr><td colspan="8"><div class="empty-state">${ic('card')}<h4>Sin pagos registrados</h4></div></td></tr>`}
    </tbody></table></div></div>`;
  wirePagosEvents();
}
function wirePagosEvents(){
  const q=document.getElementById('payClienteSearch'); if(q) q.addEventListener('input', debounce(e=>{ APP.paymentFilters.q=e.target.value; renderPagos(); },250));
  const est=document.getElementById('payEstado'); if(est) est.addEventListener('change', e=>{ APP.paymentFilters.estado=e.target.value; renderPagos(); });
  document.querySelectorAll('[data-pay-status-global]').forEach(s=>s.addEventListener('change', e=>{
    const pay = DB.state.payments.find(p=>p.id===s.getAttribute('data-pay-status-global')); if(!pay) return;
    pay.estado = e.target.value;
    if(pay.estado==='Aprobado'){ pay.valorPagado=pay.valorTotal; if(!pay.fecha) pay.fecha=isoDate(todayDate()); pay.proximaFecha=''; const c=getClient(pay.clienteId); logActivity('pago', `Pago confirmado de ${c?c.nombre:''} (${fmtMoney(pay.valorTotal)})`, pay.clienteId); }
    toast('Pago actualizado','ok'); commit();
  }));
}
function openPaymentFormGlobal(){

      <div class="card kpi"><div class="kpi-top"><div class="kpi-icon c-teal">${ICONS.trend}</div></div><div class="kpi-value">${fmtMoney(totalIngresos)}</div><div class="kpi-label">Ingresos generados</div></div>

   REPORTES

function periodRange(period){
  const today = todayDate();
  let start;
  if(period==='hoy') start = new Date(today);
  else if(period==='semana'){ start=new Date(today); start.setDate(start.getDate()-7); }
  else if(period==='mes'){ start=new Date(today); start.setDate(start.getDate()-30); }
  else if(period==='ano'){ start=new Date(today); start.setDate(start.getDate()-365); }
  else start = new Date(2000,0,1);
  return { start:isoDate(start), end:isoDate(today) };
}
function renderReportes(){
  const el = document.getElementById('view-reportes');
  APP.reportFilters = APP.reportFilters || {periodo:'mes'};
  const f = APP.reportFilters;
  const range = periodRange(f.periodo);
  let leads = DB.state.leads.filter(l=>l.fechaLead>=range.start && l.fechaLead<=range.end);
  let sales = DB.state.sales.filter(s=>(s.fecha||'')>=range.start && (s.fecha||'')<=range.end);
  let payments = DB.state.payments.filter(p=>(p.fecha||p.proximaFecha||'0')>=range.start);
  let clientsNew = DB.state.clients.filter(c=>(c.fechaIngreso||'')>=range.start && (c.fechaIngreso||'')<=range.end);
  let followups = DB.state.followups.filter(x=>(x.fecha||'')>=range.start && (x.fecha||'')<=range.end);
  if(f.responsable){ leads=leads.filter(l=>l.responsable===f.responsable); sales=sales.filter(s=>s.responsable===f.responsable); clientsNew=clientsNew.filter(c=>c.asesor===f.responsable); followups=followups.filter(x=>x.asesor===f.responsable); }
  if(f.fuente){ leads=leads.filter(l=>l.fuente===f.fuente); sales=sales.filter(s=>s.fuente===f.fuente); clientsNew=clientsNew.filter(c=>c.fuente===f.fuente); }
  const conversion = leads.length? Math.round(leads.filter(l=>l.estado==='Venta').length/leads.length*100) : 0;
  const ingresos = payments.filter(p=>p.estado==='Aprobado').reduce((s,p)=>s+Number(p.valorTotal||0),0);
  const pagosPendientes = payments.filter(p=>['Pendiente','Vencido','Fallido'].includes(p.estado)).length;
  const cards = [
    {title:'Leads', value:leads.length, sub:'nuevos leads en el período', action:'export-leads'},
    {title:'Conversión', value:conversion+'%', sub:'leads convertidos a venta', action:null},
    {title:'Ventas', value:sales.length, sub:'ventas confirmadas', action:'export-sales'},
    {title:'Ingresos', value:fmtMoney(ingresos), sub:'cobrados en el período', action:'export-payments'},
    {title:'Pagos pendientes', value:pagosPendientes, sub:'pagos por cobrar', action:'export-payments'},
    {title:'Clientes nuevos', value:clientsNew.length, sub:'clientes registrados', action:'export-clients'},
    {title:'Seguimientos', value:followups.length, sub:'contactos registrados', action:'export-followups'},
    {title:'Campañas', value:DB.state.campaigns.length, sub:'campañas activas', action:'export-campaigns'},
  ];
  el.innerHTML = `
    <div class="view-head"><div><h1>Reportes</h1><p>Resumen operativo y financiero de CreditPlus</p></div></div>
    <div class="filter-bar">
      <select id="repPeriodo">
        <option value="hoy" ${f.periodo==='hoy'?'selected':''}>Hoy</option>
        <option value="semana" ${f.periodo==='semana'?'selected':''}>Última semana</option>
        <option value="mes" ${f.periodo==='mes'?'selected':''}>Último mes</option>
        <option value="ano" ${f.periodo==='ano'?'selected':''}>Último año</option>
        <option value="todo" ${f.periodo==='todo'?'selected':''}>Todo</option>
      </select>
      <select id="repResp"><option value="">Responsable (todos)</option>${DB.state.config.responsables.map(x=>`<option ${f.responsable===x?'selected':''}>${x}</option>`).join('')}</select>
      <select id="repFuente"><option value="">Fuente (todas)</option>${CONFIG.fuentes.map(x=>`<option ${f.fuente===x?'selected':''}>${x}</option>`).join('')}</select>
    </div>
    <div class="grid grid-kpi">
      ${cards.map(k=>`<div class="card card-pad">
        <div style="font-size:12px;color:var(--ink-soft);font-weight:600;margin-bottom:6px;">${k.title}</div>
        <div class="kpi-value" style="font-size:24px;">${k.value}</div>
        <div style="font-size:11.5px;color:var(--ink-faint);margin-bottom:10px;">${k.sub}</div>
        ${k.action?`<button class="btn btn-secondary btn-sm" data-action="${k.action}">${ic('download')}CSV</button>`:''}
      </div>`).join('')}
    </div>`;
  wireReportFilters();
}
function wireReportFilters(){
  const map={repPeriodo:'periodo',repResp:'responsable',repFuente:'fuente'};
  Object.keys(map).forEach(id=>{ const elx=document.getElementById(id); if(elx) elx.addEventListener('change', e=>{ APP.reportFilters[map[id]]=e.target.value; renderReportes(); }); });
}

  const headers=['ID','Nombre','Fecha','Plataforma','Inversion','Conversaciones','Resultados','Costo_por_resultado','Ventas','Ingresos','ROI_pct','Observaciones'];
  const rows = DB.state.campaigns.map(c=>{ const costo=c.resultados?(c.inversion/c.resultados).toFixed(2):0; const roi=c.inversion?(((c.ingresos-c.inversion)/c.inversion)*100).toFixed(1):0; return [c.id,c.nombre,c.fecha,c.plataforma,c.inversion,c.conversaciones,c.resultados,costo,c.ventas,c.ingresos,roi,c.observaciones]; });

<script>
/* =====================================================================
   THEME
   ===================================================================== */
function effectiveTheme(){
  if(DB.state.ui.theme==='dark' || DB.state.ui.theme==='light') return DB.state.ui.theme;
  return (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
}
function toggleTheme(){
  const next = (effectiveTheme()==='dark') ? 'light' : 'dark';
  DB.state.ui.theme = next;
  document.documentElement.setAttribute('data-theme', next);
  DB.save();
  toast('Modo '+(next==='dark'?'oscuro':'claro')+' activado','ok');
}

/* =====================================================================
   GLOBAL EVENT DELEGATION
   ===================================================================== */
function wireGlobalEvents(){
  const notifPanel = document.getElementById('notifPanel');
  const profilePanel = document.getElementById('profilePanel');
  const searchResults = document.getElementById('globalSearchResults');
  const modalRoot = document.getElementById('modalRoot');

  document.addEventListener('click', function(e){
    if(notifPanel && !e.target.closest('#notifBtn') && !e.target.closest('#notifPanel')) notifPanel.classList.remove('open');
    if(profilePanel && !e.target.closest('#profileChip') && !e.target.closest('#profilePanel')) profilePanel.classList.remove('open');
    if(searchResults && !e.target.closest('.global-search')) searchResults.classList.remove('open');

    let t;
    if((t=e.target.closest('#notifBtn'))){ notifPanel.classList.toggle('open'); profilePanel.classList.remove('open'); return; }
    if((t=e.target.closest('#profileChip'))){ profilePanel.classList.toggle('open'); notifPanel.classList.remove('open'); return; }
    if((t=e.target.closest('[data-set-role]'))){
      DB.state.config.role = t.getAttribute('data-set-role');
      if(DB.state.config.role==='Asesor' && !DB.state.config.responsables.includes(DB.state.config.currentUser)) DB.state.config.currentUser = DB.state.config.responsables[0];
      profilePanel.classList.remove('open');
      toast('Viendo como '+DB.state.config.role,'ok');
      commit(); return;
    }
    if((t=e.target.closest('[data-action="toggle-theme"]'))){ toggleTheme(); profilePanel.classList.remove('open'); return; }
    if((t=e.target.closest('[data-nav]'))){ switchView(t.getAttribute('data-nav')); return; }
    if((t=e.target.closest('[data-nav-to]'))){ switchView(t.getAttribute('data-nav-to')); return; }
    if((t=e.target.closest('[data-search-open]'))){
      const parts=t.getAttribute('data-search-open').split(':'); const type=parts[0]; const id=parts.slice(1).join(':');
      document.getElementById('globalSearchInput').value=''; searchResults.classList.remove('open');
      if(type==='Cliente') openClientDetail(id); else if(type==='Lead') openLeadDetail(id);
      return;
    }
    if((t=e.target.closest('[data-toggle-fav]'))){ toggleFavorite(t.getAttribute('data-toggle-fav')); return; }
    if((t=e.target.closest('[data-set-etapa]'))){ setClientEtapa(t.getAttribute('data-client'), t.getAttribute('data-set-etapa')); return; }
    if((t=e.target.closest('[data-open-client]'))){ const id=t.getAttribute('data-open-client'); if(id) openClientDetail(id); return; }
    if((t=e.target.closest('[data-open-lead]'))){ const id=t.getAttribute('data-open-lead'); if(id) openLeadDetail(id); return; }
    if((t=e.target.closest('[data-open-task]'))){ const id=t.getAttribute('data-open-task'); if(id) openTaskForm(id); return; }
    if((t=e.target.closest('[data-alert-client],[data-alert-task]'))){
      const cid=t.getAttribute('data-alert-client'); const tid=t.getAttribute('data-alert-task');
      notifPanel.classList.remove('open');
      if(cid) openClientDetail(cid); else if(tid) openTaskForm(tid);
      return;
    }
    if((t=e.target.closest('[data-action]'))){
      const action = t.getAttribute('data-action');
      const id = t.getAttribute('data-id');
      const clientId = t.getAttribute('data-client');
      switch(action){
        case 'open-client-form': openClientForm(id||null); break;
        case 'delete-client': deleteClient(id); break;
        case 'whatsapp': { const phone=t.getAttribute('data-phone'); if(!phone){ toast('Este contacto no tiene teléfono registrado','err'); break; } window.open(waLink(phone),'_blank'); break; }
        case 'copy': copyToClipboard(t.getAttribute('data-value'), t.getAttribute('data-label')); break;
        case 'export-clients': exportClientsCsv(); break;
        case 'import-clients': startImportClients(); break;
        case 'open-document-form': openDocumentForm(clientId); break;
        case 'delete-document': deleteDocument(id); break;
        case 'add-note': addNoteFromTextarea(clientId); break;
        case 'open-followup-form': openFollowupForm(clientId); break;
        case 'open-followup-form-global': openFollowupFormGlobal(); break;
        case 'delete-followup': deleteFollowup(id); break;
        case 'open-payment-form': openPaymentForm(clientId); break;
        case 'quick-create-payment': quickCreatePayment(clientId); break;
        case 'open-payment-form-global': openPaymentFormGlobal(); break;
        case 'delete-payment': deletePayment(id); break;
        case 'open-process-form': openProcessForm(clientId); break;
        case 'delete-process': deleteProcess(id); break;
        case 'open-lead-form': openLeadForm(id||null); break;
        case 'delete-lead': deleteLead(id); break;
        case 'convert-lead': convertLeadToClient(id); break;
        case 'export-leads': exportLeadsCsv(); break;
        case 'open-task-form': openTaskForm(id||null); break;
        case 'delete-task': deleteTask(id); break;
        case 'export-followups': exportFollowupsCsv(); break;
        case 'export-sales': exportSalesCsv(); break;
        case 'export-payments': exportPaymentsCsv(); break;
        case 'export-campaigns': exportCampaignsCsv(); break;
        case 'export-all': exportAllCsv(); break;
        case 'open-campaign-form': openCampaignForm(id||null); break;
        case 'delete-campaign': deleteCampaign(id); break;
        case 'open-event-form': openEventForm(t.getAttribute('data-date')||null); break;
        case 'wipe-demo': wipeDemoData(); break;
        case 'wipe-all': wipeAllData(); break;
      }
      return;
    }
  });

  document.addEventListener('change', function(e){
    if(e.target.matches('[data-task-done]')) toggleTaskDone(e.target.getAttribute('data-task-done'), e.target.checked);
  });

  modalRoot.addEventListener('click', function(e){ if(e.target===modalRoot) closeModal(); });
  document.addEventListener('keydown', function(e){ if(e.key==='Escape' && modalRoot.classList.contains('open')) closeModal(); });

  document.getElementById('menuToggle').addEventListener('click', function(){
    document.getElementById('sidebar').classList.toggle('open');
    document.getElementById('mobileOverlay').classList.toggle('open');
  });
  document.getElementById('mobileOverlay').addEventListener('click', function(){
    document.getElementById('sidebar').classList.remove('open');
    this.classList.remove('open');
  });

  const gsi = document.getElementById('globalSearchInput');
  gsi.addEventListener('input', debounce(function(e){ renderSearchResults(globalSearch(e.target.value)); }, 200));
  gsi.addEventListener('focus', function(e){ if(e.target.value.trim()) renderSearchResults(globalSearch(e.target.value)); });
}

/* =====================================================================
   BOOTSTRAP
   ===================================================================== */
function init(){
  DB.load();
  if(DB.state.ui.theme==='dark' || DB.state.ui.theme==='light') document.documentElement.setAttribute('data-theme', DB.state.ui.theme);
  wireGlobalEvents();
  renderChrome();
  switchView('dashboard');
}
init();
</script>
</body>
</html>
